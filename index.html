<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>四年级奥数 · 数学指挥部</title>
  <style>
    :root {
      --bg-deep: #1a2e1a;
      --bg-mid: #2d4a2d;
      --card: #2d2d2d;
      --border: #8B7355;
      --accent: #FF6A00;
      --text: #e0e0e0;
      --muted: #9a9a9a;
      --btn: #4a7a4a;
      --btn-hover: #5c9a5c;
      --danger: #c44;
      --ok: #5c9a5c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      background:
        repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 8px,
          rgba(0, 0, 0, 0.06) 8px,
          rgba(0, 0, 0, 0.06) 16px
        ),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 12px,
          rgba(255, 255, 255, 0.02) 12px,
          rgba(255, 255, 255, 0.02) 24px
        ),
        radial-gradient(ellipse at 20% 20%, #3a5a3a 0%, transparent 50%),
        linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 45%, #1f351f 100%);
      background-attachment: fixed;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(10, 18, 10, 0.82);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
    }

    .status-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-title {
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 700;
    }

    .encourage {
      font-size: 0.9rem;
      color: #ffd08a;
    }

    .status-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 200px;
    }

    .rank-line {
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 18px;
      padding: 2px 6px;
      border: 1px solid var(--border);
      background: #1a1a1a;
    }
    .rank-bar-mark {
      width: 4px;
      height: 14px;
      background: #c4a574;
      box-shadow: 0 0 2px #000;
    }
    .rank-star {
      color: #ffd08a;
      font-size: 0.85rem;
      line-height: 1;
      text-shadow: 0 0 4px rgba(255, 180, 0, 0.5);
    }
    .rank-star.fine { font-size: 0.7rem; opacity: 0.9; }
    .rank-star.gold { color: #ffcc33; font-size: 1.1rem; }

    .toast-stack {
      position: fixed;
      top: 72px;
      right: 12px;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      min-width: 160px;
      max-width: 260px;
      padding: 10px 14px;
      background: rgba(20, 28, 20, 0.92);
      border: 1px solid var(--accent);
      color: #ffd08a;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      opacity: 0;
      transform: translateX(20px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show {
      opacity: 1;
      transform: none;
    }

    .reset-btn {
      margin-top: 6px;
      font-size: 0.75rem !important;
      padding: 4px 8px !important;
      opacity: 0.75;
    }

    .score-line {
      font-size: 0.9rem;
      color: var(--text);
    }

    .rank-bar {
      width: 220px;
      max-width: 100%;
      height: 10px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .rank-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4a7a4a, var(--accent));
      transition: width 0.4s ease;
    }

    .timer-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .source-tag {
      display: inline-block;
      margin: 0 0 10px;
      padding: 4px 10px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffd08a;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.35);
    }

    .video-meta {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .welcome-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.35);
      border-left: 4px solid var(--accent);
      color: #ffd08a;
    }

    .welcome-banner[hidden] {
      display: none !important;
    }

    .day-switch {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .day-switch select, .day-switch button {
      font-size: 0.85rem;
      padding: 6px 8px;
      background: #1a1a1a;
      color: var(--text);
      border: 1px solid var(--border);
      font-family: inherit;
    }
    .day-switch button {
      cursor: pointer;
      background: #3a3a3a;
    }

    .mute-btn {
      font-size: 0.9rem;
      padding: 8px 12px;
    }

    .timer-display {
      font-variant-numeric: tabular-nums;
      font-size: 1.25rem;
      color: var(--accent);
      min-width: 4.5em;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    .mission-card {
      background: var(--card);
      border: 2px solid var(--border);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 8px 24px rgba(0, 0, 0, 0.45);
      padding: 20px 22px 24px;
      position: relative;
    }

    .mission-card::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(139, 115, 85, 0.35);
      pointer-events: none;
    }

    .mission-title {
      margin: 0 0 4px;
      font-size: 1.55rem;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(255, 106, 0, 0.35), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .mission-sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .briefing {
      margin: 0 0 16px;
      padding: 10px 12px;
      background: rgba(74, 122, 74, 0.2);
      border: 1px dashed var(--border);
      line-height: 1.5;
    }

    .btn {
      appearance: none;
      border: 2px solid #6b8f6b;
      background: linear-gradient(180deg, #5a8a5a 0%, var(--btn) 100%);
      color: #f5f5f5;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 3px 0 #2a4a2a;
      transition: background 0.15s, transform 0.08s;
      font-family: inherit;
    }

    .btn:hover {
      background: linear-gradient(180deg, #6aaa6a 0%, var(--btn-hover) 100%);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 1px 0 #2a4a2a;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-orange {
      background: linear-gradient(180deg, #ff8a33 0%, var(--accent) 100%);
      border-color: #ffb366;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 3px 0 #a34500;
    }

    .btn-orange:hover {
      background: linear-gradient(180deg, #ff9a4d 0%, #ff7a1a 100%);
    }

    .btn-ghost {
      background: #3a3a3a;
      border-color: var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 3px 0 #1a1a1a;
    }

    .btn-ghost:hover {
      background: #4a4a4a;
    }

    .video-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }

    .scouted-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
    }

    .scouted-label input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }

    .question {
      margin-top: 16px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid #555;
    }

    .question.core {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(255, 106, 0, 0.25);
    }

    .q-badge {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .q-text {
      margin: 0 0 12px;
      line-height: 1.6;
      font-size: 1.08rem;
    }

    .answer-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .answer-input {
      flex: 1 1 160px;
      min-width: 140px;
      max-width: 280px;
      padding: 12px 14px;
      font-size: 1.15rem;
      background: #1a1a1a;
      border: 2px solid var(--border);
      color: var(--text);
      font-family: inherit;
      text-shadow: none;
    }

    .answer-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .answer-input:disabled {
      opacity: 0.7;
    }

    .feedback {
      min-height: 1.4em;
      margin: 6px 0 0;
      font-weight: 700;
    }

    .feedback.ok { color: #7dffa0; }
    .feedback.bad { color: #ff8a8a; }
    .feedback.done { color: #7dffa0; }

    .rest-box, .review-empty, .empty-box {
      text-align: center;
      padding: 36px 16px;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .review-meta {
      margin-bottom: 12px;
      color: #ffd08a;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay.show { display: flex; }

    .overlay-panel {
      background: var(--card);
      border: 3px solid var(--accent);
      padding: 28px 24px;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .overlay-panel h2 {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 1.4rem;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .timer-alert {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(255, 106, 0, 0.15);
      border: 1px solid var(--accent);
      display: none;
    }

    .timer-alert.show { display: block; }

    /* 长官讲解战术板 */
    .brief-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 1100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .brief-overlay.show { display: flex; }
    .brief-panel {
      width: min(640px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #242424;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 1px #8B7355 inset, 0 12px 40px rgba(0,0,0,0.6);
      padding: 18px 18px 16px;
    }
    .brief-panel h2 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 1.25rem;
    }
    .brief-stage {
      min-height: 160px;
      margin: 10px 0 14px;
      padding: 14px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      position: relative;
    }
    .brief-formulas {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .brief-formulas li {
      opacity: 0.25;
      transform: translateX(-8px);
      transition: opacity 0.35s, transform 0.35s, background 0.35s;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-left: 3px solid transparent;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      background: transparent;
    }
    .brief-formulas li.show {
      opacity: 1;
      transform: none;
      border-left-color: var(--accent);
      background: rgba(255, 106, 0, 0.08);
    }
    .brief-formulas li.active {
      opacity: 1;
      border-left-color: #7dffa0;
      background: rgba(92, 154, 92, 0.18);
      box-shadow: 0 0 12px rgba(125, 255, 160, 0.15);
    }
    .brief-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }
    .bar-label {
      width: 5.5em;
      flex-shrink: 0;
      font-size: 0.9rem;
      color: #ffd08a;
    }
    .bar-track {
      flex: 1;
      height: 28px;
      background: #111;
      border: 1px solid #555;
      position: relative;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4a7a4a, #6aaa6a);
      transition: width 0.7s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .bar-fill.more { background: linear-gradient(90deg, #a34500, var(--accent)); }
    .seg-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin: 12px 0;
      align-items: flex-end;
    }
    .seg {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      background: #333;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.35s, transform 0.35s, background 0.35s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .seg.show { opacity: 1; transform: scale(1); }
    .seg.hi { background: var(--accent); border-color: #ffb366; color: #111; }
    .tree-line {
      position: relative;
      height: 48px;
      margin: 28px 8px 8px;
      border-bottom: 3px solid #8B7355;
    }
    .tree-dot {
      position: absolute;
      bottom: -7px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #555;
      border: 2px solid #aaa;
      transform: scale(0);
      transition: transform 0.3s ease, background 0.3s;
    }
    .tree-dot.show { transform: scale(1); background: var(--accent); border-color: #ffd08a; }
    .tree-dot.ghost { background: transparent; border-style: dashed; opacity: 0.5; }
    .brief-caption {
      color: #ffd08a;
      min-height: 1.4em;
      margin: 0 0 8px;
      font-size: 0.95rem;
    }
    .eq-box {
      text-align: center;
      font-size: 1.35rem;
      color: var(--accent);
      padding: 16px;
      letter-spacing: 0.04em;
    }
    .eq-box .pop {
      display: inline-block;
      animation: popIn 0.45s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* —— 登录 / 主界面 —— */
    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255, 106, 0, 0.12) 0%, transparent 55%),
        rgba(10, 18, 10, 0.96);
    }
    .login-overlay[hidden] { display: none !important; }
    .login-card {
      width: min(400px, 100%);
      background: var(--card);
      border: 2px solid var(--border);
      box-shadow: 0 16px 48px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
      padding: 28px 24px;
      text-align: center;
    }
    .login-card h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      color: var(--accent);
    }
    .login-card p { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; }
    .login-field { margin-bottom: 14px; text-align: left; }
    .login-field label { display: block; font-size: 0.85rem; color: #ffd08a; margin-bottom: 6px; }
    .login-field input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      background: #1a1a1a;
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-family: inherit;
    }
    .login-field input:focus { outline: none; border-color: var(--accent); }
    .btn-hero {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.15rem;
      border-radius: 12px;
      margin-top: 8px;
    }
    .login-hint { margin-top: 14px; font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.82rem;
      color: #ffd08a;
    }
    .energy-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(255, 106, 0, 0.15);
      border: 1px solid var(--accent);
      border-radius: 20px;
      font-size: 0.85rem;
      color: #ffd08a;
      font-weight: 700;
    }

    /* —— 任务主流程（iPhone 式大按钮） —— */
    .command-dock {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 0 0;
      margin-top: 20px;
      background: linear-gradient(transparent, var(--card) 30%);
    }
    .step-rail {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      justify-content: center;
    }
    .step-pill {
      flex: 1;
      max-width: 120px;
      text-align: center;
      padding: 10px 8px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 2px solid #555;
      background: #1a1a1a;
      color: var(--muted);
      border-radius: 10px;
      transition: all 0.2s;
    }
    .step-pill.active {
      border-color: var(--accent);
      background: rgba(255, 106, 0, 0.15);
      color: #ffd08a;
    }
    .step-pill.done {
      border-color: var(--ok);
      color: #7dffa0;
    }
    .day-progress-wrap {
      margin: 0 0 16px;
    }
    .day-progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: #ffd08a;
      margin-bottom: 6px;
    }
    .day-progress-bar {
      height: 14px;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .day-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4a7a4a, var(--accent));
      border-radius: 8px;
      transition: width 0.35s ease;
    }
    .phase-tag {
      display: inline-block;
      padding: 4px 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
    }
    .phase-tag.foundation { background: rgba(74,122,74,0.35); color: #7dffa0; border: 1px solid #5c9a5c; }
    .phase-tag.advancement { background: rgba(255,106,0,0.2); color: #ffd08a; border: 1px solid var(--accent); }
    .video-hero {
      text-align: center;
      padding: 24px 16px;
      background: rgba(0,0,0,0.25);
      border: 2px dashed var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .video-hero .btn-hero { max-width: 320px; margin: 12px auto 0; }
    .quiz-card {
      padding: 20px;
      background: rgba(0,0,0,0.28);
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,106,0,0.12);
    }
    .quiz-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .quiz-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #444;
      border: 2px solid #666;
      transition: all 0.25s;
    }
    .quiz-dot.done { background: var(--ok); border-color: #7dffa0; }
    .quiz-dot.current { background: var(--accent); border-color: #ffd08a; transform: scale(1.2); }
    .answer-input-lg {
      width: 100%;
      max-width: none;

    /* ========== 工具 ========== */
    function padDay(n) {
      return String(n).padStart(2, "0");
    }

    function phaseLabel(phase) {
      return phase === "foundation" ? "打基础" : phase === "advancement" ? "提升" : "";
    }

    function findCourseByDay(dayNum) {
      return courses.find((c) => c.dayNum === dayNum) || null;
    }

    function qid(dayNum, index) {
      return `d${dayNum}-q${index}`;
    }

    function getDefaultDayNum() {
      const missionDays = courses.filter((c) => !c.type).map((c) => c.dayNum);
      for (const d of missionDays) {
        if (!progress.clearedDays.includes(d)) return d;
      }
      return missionDays[missionDays.length - 1] || 1;
    }

    function getActiveDayNum() {
      if (selectedDayNum != null) return selectedDayNum;
      return getDefaultDayNum();
    }

    function dayQuestionDoneCount(dayNum) {
      let n = 0;
      for (let i = 0; i < QUESTIONS_PER_DAY; i++) {
        if (getQState(qid(dayNum, i)).status === "correct") n++;
      }
      return n;
    }

    function firstUnfinishedQIndex(dayNum) {
      for (let i = 0; i < QUESTIONS_PER_DAY; i++) {
        if (getQState(qid(dayNum, i)).status !== "correct") return i;
      }
      return QUESTIONS_PER_DAY;
    }

    function dayKey(dayNum) {
      return `day-${dayNum}`;
    }

    function normalizeAnswer(v) {
      return String(v).trim().replace(/\s+/g, "");
    }

    function answersEqual(user, expected) {
      return normalizeAnswer(user) === normalizeAnswer(expected);
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getRankIndex(count) {
      let idx = 0;
      for (let i = 0; i < RANKS.length; i++) {
        if (count >= RANKS[i].need) idx = i;
      }
      return idx;
    }

    function nextRankNeed(count) {
      const idx = getRankIndex(count);
      if (idx >= RANKS.length - 1) return RANKS[RANKS.length - 1].need;
      return RANKS[idx + 1].need;
    }

    /* ========== 存储 ========== */
    function defaultProgress() {
      return {
        correctCount: 0,
        energy: 0,
        questions: {},
        wrongList: [],
        clearedTopics: [],
        clearedDays: [],
        promotedAnnounced: [],
        lastWelcomeDay: "",
        scoutedDays: [],
        enlistedSpoken: false,
        accountName: ""
      };
    }

    function updateStorageKey() {
      STORAGE_KEY = `redAlert_progress_${STORAGE_VERSION}_${accountHash}`;
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultProgress();
        const data = JSON.parse(raw);
        return {
          correctCount: data.correctCount || 0,
          energy: data.energy || 0,
          questions: data.questions || {},
          wrongList: Array.isArray(data.wrongList) ? data.wrongList : [],
          clearedTopics: Array.isArray(data.clearedTopics) ? data.clearedTopics : [],
          clearedDays: Array.isArray(data.clearedDays) ? data.clearedDays.filter((d) => typeof d === "number") : [],
          promotedAnnounced: Array.isArray(data.promotedAnnounced) ? data.promotedAnnounced : [],
          lastWelcomeDay: data.lastWelcomeDay || data.lastWelcomeDate || "",
          scoutedDays: Array.isArray(data.scoutedDays) ? data.scoutedDays : [],
          enlistedSpoken: !!data.enlistedSpoken,
          accountName: data.accountName || accountName
        };
      } catch (e) {
        return defaultProgress();
      }
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    let progress = defaultProgress();

    function getQState(id) {
      return progress.questions[id] || { status: "unanswered", firstCorrect: false };
    }

    function setQState(id, state) {
      progress.questions[id] = state;
      saveProgress();
    }

    function addWrong(id) {
      if (!progress.wrongList.includes(id)) {
        progress.wrongList.push(id);
        saveProgress();
      }
    }

    function removeWrong(id) {
      progress.wrongList = progress.wrongList.filter((x) => x !== id);
      saveProgress();
    }

    /* ========== 语音 + 背景音乐 ========== */
    const bgmEl = document.getElementById("bgmAudio");
    let soundMuted = localStorage.getItem("redAlert_mute") === "1";
    let bgmStopTimer = null;
    let pendingWelcomeLine = "";

    function updateMuteBtn() {
      const btn = document.getElementById("muteBtn");
      if (!btn) return;
      btn.textContent = soundMuted ? "🔇 音效关" : "🔊 音效开";
    }

    function setMuted(muted) {
      soundMuted = muted;
      localStorage.setItem("redAlert_mute", muted ? "1" : "0");
      if (muted) {
        stopBgm();
        stopVoicePlayer();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      }
      updateMuteBtn();
    }

    function stopBgm() {
      if (bgmStopTimer) {
        clearTimeout(bgmStopTimer);
        bgmStopTimer = null;
      }
      try {
        bgmEl.pause();
        bgmEl.currentTime = 0;
      } catch (e) { /* ignore */ }
    }

    /** 播放一段战地 BGM（默认约 14 秒后淡出停止） */
    function playBgmBurst(durationMs = 14000, volume = 0.32) {
      if (soundMuted) return Promise.resolve();
      return new Promise((resolve) => {
        try {
          if (bgmStopTimer) clearTimeout(bgmStopTimer);
          bgmEl.loop = true;
          bgmEl.volume = volume;
          bgmEl.currentTime = 0;
          const p = bgmEl.play();
          const finish = () => {
            const startVol = bgmEl.volume;
            let step = 0;
            const fade = setInterval(() => {
              step += 1;
              bgmEl.volume = Math.max(0, startVol * (1 - step / 8));
              if (step >= 8) {
                clearInterval(fade);
                stopBgm();
                resolve();
              }
            }, 80);
          };
          bgmStopTimer = setTimeout(finish, durationMs);
          if (p && p.then) p.catch(() => resolve());
          else resolve();
        } catch (e) {
          resolve();
        }
      });
    }

    function duckBgmForSpeech() {
      if (!bgmEl || bgmEl.paused) return;
      bgmEl.volume = Math.min(bgmEl.volume, 0.12);
    }

    let cachedMaleVoice = null;
    let voicesReady = false;
    let voicePlayer = null;

    function stopVoicePlayer() {
      if (voicePlayer) {
        try {
          voicePlayer.onended = null;
          voicePlayer.onerror = null;
          voicePlayer.pause();
          voicePlayer.src = "";
        } catch (e) { /* ignore */ }
        voicePlayer = null;
      }
    }

    /** 优先播放预生成的 Edge 男声 MP3，失败再回退系统语音（仅男声，绝不播女声） */
    function playVoiceFile(relPath) {
      if (soundMuted) return Promise.resolve(false);
      return new Promise((resolve) => {
        // 播男声 MP3 前，先掐掉系统语音，避免男女声打架
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        stopVoicePlayer();
        const a = new Audio(relPath);
        voicePlayer = a;
        a.onended = () => {
          if (voicePlayer === a) voicePlayer = null;
          resolve(true);
        };
        a.onerror = () => {
          if (voicePlayer === a) voicePlayer = null;
          resolve(false);
        };
        duckBgmForSpeech();
        const p = a.play();
        if (p && p.then) p.catch(() => resolve(false));
      });
    }

    function scoreMaleVoice(v) {
      const n = (v.name + " " + v.lang).toLowerCase();
      if (!/zh|chinese|中文/.test(n)) return -100;
      let s = 10;
      if (/natural|neural|online|云|neural/.test(n)) s += 40;
      if (/yunyang|yunjian|yunfeng|yunze|kangkang|yunhao|yunjie|男/.test(n)) s += 50;
      if (/male/.test(n)) s += 30;
      if (/huihui|xiaoxiao|xiaoyi|xiaoxuan|xiaohan|female|女|yaoyao|hui/.test(n)) s -= 60;
      if (/google/.test(n)) s += 5;
      return s;
    }

    function pickCommanderVoice() {
      if (cachedMaleVoice) return cachedMaleVoice;
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      if (!voices.length) return null;
      const ranked = voices
        .map((v) => ({ v, s: scoreMaleVoice(v) }))
        .filter((x) => x.s > 0)
        .sort((a, b) => b.s - a.s);
      cachedMaleVoice = ranked.length ? ranked[0].v : voices.find((v) => /zh/.test(v.lang)) || null;
      return cachedMaleVoice;
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = function () {
        cachedMaleVoice = null;
        voicesReady = true;
        pickCommanderVoice();
      };
      pickCommanderVoice();
    }

    function speak(text, opts) {
      if (soundMuted || !text) return Promise.resolve();

      // 固定台词：优先真人男声 MP3
      if (opts && opts.file) {
        return playVoiceFile(opts.file).then((ok) => {
          if (ok) return;
          return speakSynth(text, opts);
        });
      }
      return speakSynth(text, opts);
    }

    function speakSynth(text, opts) {
      if (!window.speechSynthesis || !text) return Promise.resolve();
      const voice = pickCommanderVoice();
      // 找不到可靠男声就静音，绝不用系统女声
      if (!voice || scoreMaleVoice(voice) < 40) {
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        try {
          if (!(opts && opts.queue)) window.speechSynthesis.cancel();
          duckBgmForSpeech();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "zh-CN";
          u.rate = (opts && opts.rate) != null ? opts.rate : 0.78;
          u.pitch = (opts && opts.pitch) != null ? opts.pitch : 0.72;
          u.volume = 1;
          u.voice = voice;
          u.onend = () => resolve();
          u.onerror = () => resolve();
          window.speechSynthesis.speak(u);
        } catch (e) {
          resolve();
        }
      });
    }

    /** 语音排队：命中 / 晋升 / 通关 不叠播 */
    let voiceChain = Promise.resolve();
    function enqueueVoice(fn) {
      voiceChain = voiceChain.then(() => fn()).catch(() => {});
      return voiceChain;
    }

    function playWelcomeComm(line) {
      const idx = Math.max(0, WELCOME_SPEECH.indexOf(line));
      const file = `voice/welcome-${idx >= 0 ? idx : 0}.mp3`;
      playBgmBurst(16000, 0.34);
      setTimeout(() => enqueueVoice(() => speak(line, { file })), 600);
    }

    function playClearFanfare() {
      playBgmBurst(12000, 0.38);
      return enqueueVoice(() =>
        speak("完美！今日任务全部完成，你证明了自己！", { file: "voice/clear.mp3" })
      );
    }

    /* ========== 长官讲解：图形 + 算式动画 ========== */
    let briefToken = 0;
    let briefCurrentQ = null;

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function buildBriefing(q) {
      const ex = q.ex;
      if (!ex) {
        return {
          steps: [
            {
              say: "士兵，听好了。" + (q.hint || "仔细审题，找到已知条件。"),
              formula: q.hint || "",
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${escapeHtml(String(q.answer))}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "sd") {
        const less = (ex.S - ex.D) / 2;
        const more = less + ex.D;
        const max = Math.max(more, less, 1);
        return {
          steps: [
            {
              say: `士兵，看战术板。${ex.A}和${ex.B}一共${ex.S}。`,
              formula: `${ex.A} + ${ex.B} = ${ex.S}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.A)}</span><div class="bar-track"><div class="bar-fill more" id="bA"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>
                  <div class="eq-box">合计 ${ex.S}</div>`;
                requestAnimationFrame(() => {
                  document.getElementById("bA").style.width = "70%";
                  document.getElementById("bB").style.width = "55%";
                });
              }
            },
            {
              say: `${ex.A}比${ex.B}多${ex.D}。先把多出来的${ex.D}拿掉，两边就一样长了。`,
              formula: `${ex.S} − ${ex.D} = ${ex.S - ex.D}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.A)}</span><div class="bar-track"><div class="bar-fill more" id="bA" style="width:${(more/max)*100}%"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB" style="width:${(less/max)*100}%"></div></div></div>
                  <div class="eq-box">多出的 ${ex.D} 先拿掉 → 剩下 ${ex.S - ex.D}</div>`;
              }
            },
            {
              say: `剩下的${ex.S - ex.D}平分，每边是${less}。这就是${ex.B}。`,
              formula: `(${ex.S} − ${ex.D}) ÷ 2 = ${less}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB2"></div></div></div>
                  <div class="eq-box pop">各 ${less}</div>`;
                requestAnimationFrame(() => {
                  const w = (less / max) * 100 + "%";
                  document.getElementById("bB").style.width = w;
                  document.getElementById("bB2").style.width = w;
                });
              }
            },
            {
              say: ex.want === "B"
                ? `所以${ex.B}是${less}。记住：和差问题，先减差再平分。`
                : ex.want === "both"
                  ? `${ex.A}就是${less}加${ex.D}，等于${more}。答案是${more}和${less}。`
                  : `${ex.A}是${less}加${ex.D}，等于${more}。目标锁定！`,
              formula: ex.want === "B"
                ? `${ex.B} = ${less}`
                : ex.want === "both"
                  ? `${ex.A}=${more}，${ex.B}=${less}`
                  : `${ex.A} = ${less} + ${ex.D} = ${more}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.A)}</span><div class="bar-track"><div class="bar-fill more" id="bA"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>
                  <div class="eq-box"><span class="pop">${ex.want === "B" ? less : ex.want === "both" ? more + " , " + less : more}</span></div>`;
                requestAnimationFrame(() => {
                  document.getElementById("bA").style.width = (more / max) * 100 + "%";
                  document.getElementById("bA").textContent = more;
                  document.getElementById("bB").style.width = (less / max) * 100 + "%";
                  document.getElementById("bB").textContent = less;
                });
              }
            }
          ]
        };
      }

      if (ex.t === "sm") {
        // (S+D)/2 = more
        const more = (ex.S + ex.D) / 2;
        const less = more - ex.D;
        return buildBriefing({ ...q, ex: { t: "sd", A: ex.A, B: ex.B, S: ex.S, D: ex.D, want: "A" } });
      }

      if (ex.t === "give") {
        const diff = ex.A - ex.B;
        const half = diff / 2;
        return {
          steps: [
            {
              say: `士兵，${ex.A}有${ex.Xa}，${ex.B}有${ex.Xb}。差是${diff}。`,
              formula: `${ex.Xa} − ${ex.Xb} = ${diff}`,
              paint: (stage) => {
                const max = Math.max(ex.Xa, ex.Xb);
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.A)}</span><div class="bar-track"><div class="bar-fill more" id="bA"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>`;
                requestAnimationFrame(() => {
                  document.getElementById("bA").style.width = (ex.Xa / max) * 100 + "%";
                  document.getElementById("bA").textContent = ex.Xa;
                  document.getElementById("bB").style.width = (ex.Xb / max) * 100 + "%";
                  document.getElementById("bB").textContent = ex.Xb;
                });
              }
            },
            {
              say: `要一样多，把差的一半交给对方。一半是${half}。`,
              formula: `${diff} ÷ 2 = ${half}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">差 ${diff} → 给出一半 <span class="pop">${half}</span></div>
                  <div class="seg-row">${Array.from({length: diff}, (_,i) => `<div class="seg ${i<half?"hi":""}" id="g${i}"></div>`).join("")}</div>`;
                requestAnimationFrame(() => {
                  for (let i = 0; i < diff; i++) {
                    setTimeout(() => document.getElementById("g" + i).classList.add("show"), i * 80);
                  }
                });
              }
            },
            {
              say: `所以从${ex.A}拿出${half}给${ex.B}，两边就扳平了。`,
              formula: `给出 ${half}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">给出 ${half}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "mul") {
        return {
          steps: [
            {
              say: `士兵，这是倍数侦察。${ex.A}是${ex.Xa}，${ex.B}是${ex.Xb}。`,
              formula: `${ex.A}=${ex.Xa}，${ex.B}=${ex.Xb}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="seg-row" id="segs"></div><div class="eq-box">${escapeHtml(ex.A)} ÷ ${escapeHtml(ex.B)}</div>`;
                const box = document.getElementById("segs");
                for (let i = 0; i < ex.Xa; i++) {
                  const d = document.createElement("div");
                  d.className = "seg";
                  d.textContent = i < ex.Xb ? "B" : "A";
                  if (i >= ex.Xb) d.classList.add("hi");
                  box.appendChild(d);
                  setTimeout(() => d.classList.add("show"), i * 50);
                }
              }
            },
            {
              say: `${ex.Xa}除以${ex.Xb}，等于${ex.Xa / ex.Xb}倍。命中。`,
              formula: `${ex.Xa} ÷ ${ex.Xb} = ${ex.Xa / ex.Xb}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${ex.Xa / ex.Xb} 倍</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "cd") {
        const small = ex.D / (ex.K - 1);
        const big = small * ex.K;
        return {
          steps: [
            {
              say: `差倍战术：${ex.A}是${ex.B}的${ex.K}倍，又多${ex.D}。`,
              formula: `${ex.A} = ${ex.K} × ${ex.B}，${ex.A} − ${ex.B} = ${ex.D}`,
              paint: (stage) => {
                let html = `<div class="seg-row">`;
                for (let i = 0; i < ex.K; i++) html += `<div class="seg hi" id="c${i}"></div>`;
                html += `</div><div class="eq-box">${ex.K} 份里，多出的是 ${ex.K - 1} 份</div>`;
                stage.innerHTML = html;
                requestAnimationFrame(() => {
                  for (let i = 0; i < ex.K; i++) setTimeout(() => document.getElementById("c" + i).classList.add("show"), i * 120);
                });
              }
            },
            {
              say: `多出来的${ex.D}，正好是${ex.K - 1}份。所以一份是${small}。`,
              formula: `${ex.D} ÷ (${ex.K} − 1) = ${small}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">每份 = <span class="pop">${small}</span></div>`;
              }
            },
            {
              say: ex.want === "A"
                ? `${ex.A}有${ex.K}份，是${big}。`
                : `${ex.B}就是一份，等于${small}。目标确认！`,
              formula: ex.want === "A" ? `${ex.A} = ${small} × ${ex.K} = ${big}` : `${ex.B} = ${small}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${ex.want === "A" ? big : small}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "hb") {
        const small = ex.S / (ex.K + 1);
        const big = small * ex.K;
        return {
          steps: [
            {
              say: `和倍作战：一共${ex.S}，${ex.A}是${ex.B}的${ex.K}倍。把总数分成${ex.K + 1}份。`,
              formula: `总份数 = ${ex.K} + 1 = ${ex.K + 1}`,
              paint: (stage) => {
                let html = `<div class="seg-row">`;
                for (let i = 0; i < ex.K + 1; i++) {
                  html += `<div class="seg ${i < ex.K ? "hi" : ""}" id="h${i}">${i < ex.K ? "A" : "B"}</div>`;
                }
                html += `</div><div class="eq-box">共 ${ex.K + 1} 份 = ${ex.S}</div>`;
                stage.innerHTML = html;
                requestAnimationFrame(() => {
                  for (let i = 0; i < ex.K + 1; i++) setTimeout(() => document.getElementById("h" + i).classList.add("show"), i * 100);
                });
              }
            },
            {
              say: `${ex.S}除以${ex.K + 1}，一份是${small}。这就是${ex.B}。`,
              formula: `${ex.S} ÷ ${ex.K + 1} = ${small}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">每份 <span class="pop">${small}</span> = ${escapeHtml(ex.B)}</div>`;
              }
            },
            {
              say: ex.want === "A" ? `${ex.A}有${ex.K}份，是${big}。` : `所以${ex.B}是${small}。漂亮。`,
              formula: ex.want === "A" ? `${ex.A} = ${small}×${ex.K} = ${big}` : `${ex.B} = ${small}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${ex.want === "A" ? big : small}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "hbm") {
        // parts like [2,1,1] sum S
        const totalParts = ex.parts.reduce((a, b) => a + b, 0);
        const one = ex.S / totalParts;
        const ans = Math.round(one); // for the 26 case they use integer
        const exact = ex.exact != null ? ex.exact : one;
        return {
          steps: [
            {
              say: `多部队联合作战。按倍数分成${ex.parts.join("、")}份，总共${totalParts}份。`,
              formula: `份数：${ex.parts.join(" + ")} = ${totalParts}`,
              paint: (stage) => {
                let html = `<div class="seg-row">`;
                let idx = 0;
                ex.parts.forEach((p, pi) => {
                  for (let i = 0; i < p; i++) {
                    html += `<div class="seg ${pi === 0 ? "hi" : ""}" id="m${idx}">${pi + 1}</div>`;
                    idx++;
                  }
                });
                html += `</div>`;
                stage.innerHTML = html;
                requestAnimationFrame(() => {
                  for (let i = 0; i < totalParts; i++) setTimeout(() => document.getElementById("m" + i).classList.add("show"), i * 80);
                });
              }
            },
            {
              say: `${ex.S}除以${totalParts}，大约每份${Number.isInteger(one) ? one : one.toFixed(1)}。题目要求取整，第三支是${exact}。`,
              formula: `${ex.S} ÷ ${totalParts} ≈ ${exact}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${exact}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "tree") {
        const segs = ex.L / ex.G;
        const n = ex.mode === "none" ? segs - 1 : segs + 1;
        return {
          steps: [
            {
              say: `防线长${ex.L}米，每隔${ex.G}米一个点。先算段数：${ex.L}除以${ex.G}等于${segs}段。`,
              formula: `${ex.L} ÷ ${ex.G} = ${segs}（段）`,
              paint: (stage) => {
                const count = segs + 1;
                let html = `<div class="tree-line">`;
                for (let i = 0; i < count; i++) {
                  const left = (i / (count - 1)) * 100;
                  const ghost = ex.mode === "none" && (i === 0 || i === count - 1);
                  html += `<div class="tree-dot ${ghost ? "ghost" : ""}" id="t${i}" style="left:calc(${left}% - 7px)"></div>`;
                }
                html += `</div><div class="eq-box">${segs} 段</div>`;
                stage.innerHTML = html;
              }
            },
            {
              say: ex.mode === "none"
                ? `两端都不建，点数等于段数减一：${segs}减1等于${n}。`
                : `两端都建，点数等于段数加一：${segs}加1等于${n}。`,
              formula: ex.mode === "none" ? `${segs} − 1 = ${n}` : `${segs} + 1 = ${n}`,
              paint: (stage) => {
                const count = segs + 1;
                let html = `<div class="tree-line">`;
                for (let i = 0; i < count; i++) {
                  const left = (i / (count - 1)) * 100;
                  const skip = ex.mode === "none" && (i === 0 || i === count - 1);
                  html += `<div class="tree-dot ${skip ? "ghost" : ""}" id="t${i}" style="left:calc(${left}% - 7px)"></div>`;
                }
                html += `</div><div class="eq-box"><span class="pop">${n} 座</span></div>`;
                stage.innerHTML = html;
                requestAnimationFrame(() => {
                  for (let i = 0; i < count; i++) {
                    const skip = ex.mode === "none" && (i === 0 || i === count - 1);
                    if (!skip) setTimeout(() => document.getElementById("t" + i).classList.add("show"), i * 100);
                  }
                });
              }
            }
          ]
        };
      }

      if (ex.t === "digit") {
        const tens = (ex.S + ex.D) / 2;
        const ones = tens - ex.D;
        return {
          steps: [
            {
              say: `密码破译：十位与个位之和${ex.S}，十位比个位大${ex.D}。这就是和差。`,
              formula: `十位 + 个位 = ${ex.S}，十位 − 个位 = ${ex.D}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">□ □</div>`;
              }
            },
            {
              say: `十位等于和加差再除以2：${tens}。个位是${ones}。密码是${tens}${ones}。`,
              formula: `十位=(${ex.S}+${ex.D})÷2=${tens}，个位=${ones}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${tens}${ones}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "stair") {
        const c = (ex.S - ex.d1 - ex.d2) / 3;
        return {
          steps: [
            {
              say: `三座军火库像台阶一样：甲最高，乙居中，丙最低。甲比丙多${ex.d1}，乙比丙多${ex.d2}。设丙为基准。`,
              formula: `丙 = x，乙 = x+${ex.d2}，甲 = x+${ex.d1}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">甲</span><div class="bar-track"><div class="bar-fill more" id="bA"></div></div></div>
                  <div class="bar-row"><span class="bar-label">乙</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>
                  <div class="bar-row"><span class="bar-label">丙</span><div class="bar-track"><div class="bar-fill" id="bC"></div></div></div>`;
                requestAnimationFrame(() => {
                  document.getElementById("bA").style.width = "90%";
                  document.getElementById("bB").style.width = "70%";
                  document.getElementById("bC").style.width = "50%";
                });
              }
            },
            {
              say: `三个加起来共${ex.S}吨。丙等于（${ex.S}减去${ex.d1}再减去${ex.d2}）再除以3，等于${c}。`,
              formula: `丙 = (${ex.S}-${ex.d1}-${ex.d2}) ÷ 3 = ${c}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">丙 = <span class="pop">${c}</span></div>`;
              }
            }
          ]
        };
      }

      return buildBriefing({ ...q, ex: null });
    }

    async function runBriefing(q, meta) {
      const token = ++briefToken;
      briefCurrentQ = { q, meta };
      const { steps } = buildBriefing(q);
      const overlay = document.getElementById("briefOverlay");
      const stage = document.getElementById("briefStage");
      const formulas = document.getElementById("briefFormulas");
      const caption = document.getElementById("briefCaption");
      overlay.classList.add("show");
      formulas.innerHTML = steps.map((s) => `<li>${escapeHtml(s.formula)}</li>`).join("");
      stage.innerHTML = "";
      caption.textContent = "长官频道已接通（云扬男声）……";

      const idBase =
        meta && meta.dayNum != null
          ? `d${meta.dayNum}-q${meta.index}`
          : null;

      for (let i = 0; i < steps.length; i++) {
        if (token !== briefToken) return;
        const step = steps[i];
        const lis = formulas.querySelectorAll("li");
        lis.forEach((li, idx) => {
          li.classList.toggle("show", idx <= i);
          li.classList.toggle("active", idx === i);
        });
        caption.textContent = step.say;
        if (step.paint) step.paint(stage);
        await sleep(280);
        if (token !== briefToken) return;
        const stepFile = idBase ? `voice/brief/${idBase}-s${i}.mp3` : null;
        await speak(step.say, { file: stepFile, rate: 0.76, pitch: 0.7 });
        if (token !== briefToken) return;
        await sleep(180);
      }
      caption.textContent = "讲解完毕。听懂了就去瞄准目标！";
      await speak("讲解完毕。听懂了就去瞄准目标！", {
        file: "voice/brief-end.mp3",
        rate: 0.78,
        pitch: 0.7
      });
    }

    function closeBriefing() {
      briefToken++;
      stopVoicePlayer();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      document.getElementById("briefOverlay").classList.remove("show");
    }

    document.getElementById("briefCloseBtn").addEventListener("click", closeBriefing);
    document.getElementById("briefReplayBtn").addEventListener("click", () => {
      if (briefCurrentQ) runBriefing(briefCurrentQ.q, briefCurrentQ.meta);
    });
    document.getElementById("briefOverlay").addEventListener("click", (e) => {
      if (e.target.id === "briefOverlay") closeBriefing();
    });

    function maybePromote(oldCount, newCount) {
      const oldIdx = getRankIndex(oldCount);
      const newIdx = getRankIndex(newCount);
      if (newIdx > oldIdx) {

          if (!progress.promotedAnnounced.includes(i)) {

            const line = PROMOTE_SPEECH[i];

    /* ========== 题目解析 ========== */
    function parseQid(id) {
      const m = /^d(\d+)-q(\d+)$/.exec(id);
      if (!m) {
        const legacy = /^w(\d+)-d(\d+)-q(\d+)$/.exec(id);
        if (!legacy) return null;
        return { dayNum: null, week: +legacy[1], day: +legacy[2], index: +legacy[3], legacy: true };
      }
      return { dayNum: +m[1], index: +m[2], legacy: false };
    }

    function lookupQuestion(id) {
      const p = parseQid(id);
      if (!p) return null;
      let course = null;
      if (p.dayNum != null) course = findCourseByDay(p.dayNum);
      else if (p.legacy) course = courses.find((c) => c.week === p.week && c.day === p.day);
      if (!course || !course.questions) return null;
      const q = course.questions[p.index];
      if (!q) return null;
      return { course, q, dayNum: course.dayNum, index: p.index };
    }

    function activeQuestionEntries(course) {
      if (!course || !course.questions) return [];
      return course.questions.slice(0, QUESTIONS_PER_DAY).map((q, i) => ({ q, index: i, core: false }));
    }

    function topicKey(dayNum) {
      return String(dayNum);
    }

    /* ========== 彩纸 ========== */
    let confettiTimer = null;
    function runConfetti(durationMs = 3500) {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      const pieces = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: 6 + Math.random() * 8,
        h: 8 + Math.random() * 10,
        vy: 2 + Math.random() * 4,
        vx: -2 + Math.random() * 4,
        rot: Math.random() * Math.PI,
        vr: -0.2 + Math.random() * 0.4,
        color: ["#FF6A00", "#ffd08a", "#5c9a5c", "#e0e0e0", "#ff4d4d"][Math.floor(Math.random() * 5)]
      }));
      const start = performance.now();
      cancelAnimationFrame(confettiTimer);
      function frame(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          if (p.y > canvas.height) p.y = -20;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        if (now - start < durationMs) {
          confettiTimer = requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      confettiTimer = requestAnimationFrame(frame);
    }

    /* ========== 作答逻辑 ========== */
    function markCorrect(id, hitIndex) {
      const prev = getQState(id);
      const oldCount = progress.correctCount;
      let first = prev.firstCorrect;
      if (!first) {
        first = true;
        progress.correctCount += 1;
        saveProgress();
      } else {
        refreshRankUI();
      }
      setQState(id, { status: "correct", firstCorrect: true });
      removeWrong(id);
      const speechIdx = Math.min(Math.max(hitIndex, 0), HIT_SPEECH.length - 1);
      showToast(HIT_TOAST[speechIdx] || HIT_SPEECH[speechIdx]);
      // 先命中语音，再晋升语音，通关语音最后入队 —— 避免叠声/女声抢麦
      enqueueVoice(() => speak(HIT_SPEECH[speechIdx], { file: `voice/hit-${speechIdx}.mp3` }));
      if (first) maybePromote(oldCount, progress.correctCount);
    }

    function speakMissEncourage() {
      const idx = Math.floor(Math.random() * MISS_SPEECH.length);
      return speak(MISS_SPEECH[idx], { file: `voice/miss-${idx}.mp3` });
    }

    function stopMissionTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      timerRunning = false;
      timerStoppedAt = Date.now();
      document.getElementById("timerBtn").disabled = false;
      document.getElementById("timerBtn").textContent = "⏱️ 任务结束";
    }

    function getElapsedSec() {
      if (!timerStartedAt) return 0;
      const end = timerStoppedAt || Date.now();
      return Math.floor((end - timerStartedAt) / 1000);
    }

    function checkDailyClear(dayNum, course) {
      if (!course || course.type) return;
      if (progress.clearedDays.includes(dayNum)) return;
      const entries = activeQuestionEntries(course);
      const allOk = entries.every(({ index }) => getQState(qid(dayNum, index)).status === "correct");
      if (!allOk || entries.length === 0) return;

      progress.clearedDays.push(dayNum);
      const tk = topicKey(dayNum);
      if (!progress.clearedTopics.includes(tk)) progress.clearedTopics.push(tk);

      let gotBonus = false;
      const elapsed = getElapsedSec();
      if (elapsed > 0 && elapsed <= BONUS_TIME_SEC) {
        progress.energy = (progress.energy || 0) + BONUS_ENERGY;
        gotBonus = true;
      }
      saveProgress();
      stopMissionTimer();
      document.getElementById("timerAlert").classList.add("show");
      showClearOverlay(gotBonus, elapsed);
    }

    function checkReviewClear() {
      const remaining = progress.wrongList.filter((id) => getQState(id).status === "wrong");
      if (remaining.length === 0 && document.getElementById("missionRoot").dataset.mode === "review") {
        const box = document.getElementById("reviewDone");
        if (box) {
          box.hidden = false;
          speak("恭喜你，士兵！错题本已全部清扫干净。", { file: "voice/review-done.mp3" });
        }
      }
    }

    function renderQuizCard(dayNum, course, qIndex) {
      const entry = course.questions[qIndex];
      if (!entry) return "";
      const id = qid(dayNum, qIndex);
      const state = getQState(id);
      const locked = state.status === "correct";
      let dots = "";
      for (let i = 0; i < QUESTIONS_PER_DAY; i++) {
        const cls = getQState(qid(dayNum, i)).status === "correct" ? "done" : i === qIndex ? "current" : "";
        dots += `<span class="quiz-dot ${cls}"></span>`;
      }
      return `
        <div class="quiz-card" data-qid="${escapeHtml(id)}" data-hit="${qIndex}">
          <div class="quiz-dots">${dots}</div>
          <p class="q-badge">第 ${qIndex + 1} / ${QUESTIONS_PER_DAY} 题</p>
          <p class="q-text">${escapeHtml(entry.q)}</p>
          <input class="answer-input answer-input-lg" type="text" inputmode="numeric" placeholder="输入答案" ${locked ? "disabled" : ""} id="activeAnswer" />
          <button type="button" class="btn btn-orange btn-check-lg" id="activeCheckBtn" ${locked ? "disabled" : ""}>✅ 确认战果</button>
          <button type="button" class="btn btn-ghost" id="activeHintBtn" style="width:100%;margin-top:8px;">📢 长官讲解</button>
          <div class="feedback-slot" id="activeFeedback">${locked ? '<p class="feedback ok">✔️ 已攻克</p>' : ""}</div>
        </div>`;
    }

    function bindActiveQuestion(dayNum, course, qIndex) {
      const id = qid(dayNum, qIndex);
      const entry = course.questions[qIndex];
      const input = document.getElementById("activeAnswer");
      const checkBtn = document.getElementById("activeCheckBtn");
      const hintBtn = document.getElementById("activeHintBtn");
      const slot = document.getElementById("activeFeedback");
      if (!input || !checkBtn || !entry) return;

      const info = { course, q: entry, dayNum, index: qIndex };
      hintBtn.onclick = () => runBriefing(entry, info);

      if (checkBtn.disabled) return;

      const submit = async () => {
        const user = input.value;
        if (!normalizeAnswer(user)) {
          slot.innerHTML = `<p class="feedback bad">请先输入答案。</p>`;
          return;
        }
        if (answersEqual(user, entry.answer)) {
          markCorrect(id, qIndex);
          input.disabled = true;
          checkBtn.disabled = true;
          slot.innerHTML = `<p class="feedback ok">✔️ 命中目标！</p>`;
          refreshDayProgressUI(dayNum);
          refreshEnergyUI();

          const next = qIndex + 1;
          if (next >= QUESTIONS_PER_DAY) {
            setTimeout(() => checkDailyClear(dayNum, course), 900);
          } else {
            setTimeout(() => {
              currentQIndex = next;
              const slotEl = document.getElementById("quizSlot");
              if (slotEl) {
                slotEl.innerHTML = renderQuizCard(dayNum, course, next);
                bindActiveQuestion(dayNum, course, next);
                const ni = document.getElementById("activeAnswer");
                if (ni) ni.focus();
              }
            }, 800);
          }
        } else {
          const st = getQState(id);
          st.status = "wrong";
          st.lastReveal = String(entry.answer);
          setQState(id, st);
          addWrong(id);
          slot.innerHTML = `<p class="feedback bad">💥 未命中！正确答案是 ${escapeHtml(entry.answer)}。长官即将讲解……</p>`;
          input.value = "";
          await speakMissEncourage();
          await sleep(400);
          runBriefing(entry, info);
        }
      };

      checkBtn.onclick = submit;
      input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      input.focus();
    }

    function renderDayPicker(activeDay) {
      const days = courses.filter((c) => !c.type);
      let html = `<div class="day-picker">`;
      days.forEach((c) => {
        const cleared = progress.clearedDays.includes(c.dayNum);

        html += `<button type="button" class="day-chip ${cls}" data-day="${c.dayNum}">第${padDay(c.dayNum)}天</button>`;

      html += `</div>`;
      return html;

    function renderQuestionBlock(meta) {
      const { id, q, hitIndex, dayNum, index } = meta;
      const state = getQState(id);

      let feedback = locked
        ? `<p class="feedback done">✔️ 已攻克</p>`

          ? `<p class="feedback bad">💥 未命中！正确答案是 ${escapeHtml(state.lastReveal || q.answer)}。</p>`

          <div class="answer-row">
            <input class="answer-input" type="text" inputmode="numeric" placeholder="输入答案" ${locked ? "disabled" : ""} />
            <button type="button" class="btn btn-check" ${locked ? "disabled" : ""}>✅ 确认战果</button>
            <button type="button" class="btn btn-ghost btn-hint">📢 长官讲解</button>
          </div>
          <div class="feedback-slot">${feedback}</div>

    function bindQuestionEvents(root, onAfterAnswer) {
      root.querySelectorAll(".question").forEach((el) => {
        const id = el.dataset.qid;
        const hitIndex = Number(el.dataset.hit || 0);
        const info = lookupQuestion(id);
        if (!info) return;
        const input = el.querySelector(".answer-input");
        const slot = el.querySelector(".feedback-slot");
        const checkBtn = el.querySelector(".btn-check");
        const hintBtn = el.querySelector(".btn-hint");
        hintBtn.addEventListener("click", () => runBriefing(info.q, info));
        if (checkBtn.disabled) return;
        checkBtn.addEventListener("click", async () => {
          const user = input.value;
          if (!normalizeAnswer(user)) {
            slot.innerHTML = `<p class="feedback bad">请先输入答案。</p>`;
            return;
          }
          if (answersEqual(user, info.q.answer)) {
            markCorrect(id, hitIndex);
            input.disabled = true;
            checkBtn.disabled = true;
            slot.innerHTML = `<p class="feedback ok">✔️ 命中目标！</p>`;
            if (onAfterAnswer) onAfterAnswer(true, id);
          } else {
            const st = getQState(id);
            st.status = "wrong";
            st.lastReveal = String(info.q.answer);
            setQState(id, st);
            addWrong(id);
            slot.innerHTML = `<p class="feedback bad">💥 未命中！正确答案是 ${escapeHtml(info.q.answer)}。长官即将讲解……</p>`;
            input.value = "";
            await speakMissEncourage();
            await sleep(400);
            runBriefing(info.q, info);
            if (onAfterAnswer) onAfterAnswer(false, id);
          }
        });
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") checkBtn.click(); });
      });
    }

    function getWrongIdsForReview() {
      return progress.wrongList.filter((id) => getQState(id).status === "wrong");
    }

    function renderReview() {
      const all = getWrongIdsForReview();
      if (all.length === 0) {
        return `
          <h1 class="mission-title">📋 错题复盘</h1>
          <p class="mission-sub">战术复盘室</p>
          <div class="review-empty" id="reviewDone">
            🎉 暂无待修复漏洞！战场清净。
          </div>`;
      }
      let html = `
        <h1 class="mission-title">📋 错题复盘</h1>
        <p class="mission-sub">答对即移出错题本 · 共 ${all.length} 题</p>
        <div id="reviewList">`;
      all.forEach((id, i) => {
        const info = lookupQuestion(id);
        if (!info) return;
        html += renderQuestionBlock({ id, q: info.q, hitIndex: Math.min(i, 3), dayNum: info.dayNum, index: info.index });
      });
      html += `</div><div class="review-empty" id="reviewDone" hidden>🎉 漏洞全部修复！</div>`;
      return html;
    }

    function renderMission(dayNum, course) {
      const phaseCls = course.phase === "foundation" ? "foundation" : "advancement";
      const phaseText = phaseLabel(course.phase);
      const scoutedKey = dayKey(dayNum);
      const scouted = progress.scoutedDays.includes(scoutedKey);
      const done = dayQuestionDoneCount(dayNum);
      const allDone = done >= QUESTIONS_PER_DAY;
      const label = course.videoLabel || "";
      const metaBits = [course.videoTitle, course.videoDuration ? "约 " + course.videoDuration : ""].filter(Boolean);

      if (allDone && progress.clearedDays.includes(dayNum)) {
        missionPhase = "done";
      } else if (scouted || done > 0) {
        missionPhase = "quiz";
      } else {
        missionPhase = "video";
      }
      currentQIndex = firstUnfinishedQIndex(dayNum);
      if (currentQIndex >= QUESTIONS_PER_DAY) currentQIndex = QUESTIONS_PER_DAY - 1;

      let body = "";
      if (missionPhase === "video") {
        body = `
          <div class="video-hero">
            <p style="margin:0 0 8px;color:#ffd08a;">第①步：先看教学视频</p>
            <p class="video-meta">${escapeHtml(metaBits.join(" · "))}</p>
            <button type="button" class="btn btn-orange btn-hero" id="videoBtn">▶ 前往 B 站看视频</button>
            <label class="scouted-label" style="display:flex;justify-content:center;margin-top:16px;">
              <input type="checkbox" id="scoutedCheck" />
              我看完了，准备答题
            </label>
          </div>`;
      } else if (missionPhase === "quiz") {
        body = `<div id="quizSlot">${renderQuizCard(dayNum, course, currentQIndex)}</div>`;
      } else {
        body = `<div class="rest-box">✅ 第${padDay(dayNum)}天已全部攻克！<br />请选择下一天继续。</div>`;
      }

      const heroLabel = missionPhase === "video"
        ? "▶ 先看教学视频"
        : missionPhase === "quiz"
          ? `▶ 开始第 ${currentQIndex + 1} 题`
          : "✅ 本日已完成";

      return {
        html: `
          ${renderDayPicker(dayNum)}
          <h1 class="mission-title">${escapeHtml(course.name.redAlert)}</h1>
          <p class="mission-sub">第${padDay(dayNum)}天 · ${escapeHtml(course.topic || course.name.original)}</p>
          <span class="phase-tag ${phaseCls}">${phaseText}</span>
          <span class="source-tag">${escapeHtml(label)}</span>
          <div class="step-rail">
            <div class="step-pill ${missionPhase === "video" ? "active" : scouted || done > 0 ? "done" : ""}">① 看视频</div>
            <div class="step-pill ${missionPhase === "quiz" ? "active" : allDone ? "done" : ""}">② 做3题</div>
            <div class="step-pill ${allDone ? "done" : ""}">③ 通关</div>
          </div>
          <div class="day-progress-wrap">
            <div class="day-progress-label" id="dayProgressLabel"><span>今日战果</span><span>${done}/${QUESTIONS_PER_DAY}</span></div>
            <div class="day-progress-bar"><div class="day-progress-fill" id="dayProgressFill" style="width:${(done / QUESTIONS_PER_DAY) * 100}%"></div></div>
          </div>
          ${body}
          <div class="command-dock">
            <button type="button" class="btn btn-orange btn-hero" id="heroBtn">${heroLabel}</button>
          </div>`,
        dayNum,
        course
      };
    }

    function renderEmpty(msg) {
      return `<div class="empty-box">${msg}</div>`;
    }

    function startMissionTimerIfNeeded() {
      if (timerRunning || timerStoppedAt) return;
      const btn = document.getElementById("timerBtn");
      if (btn && !btn.disabled) btn.click();
    }

    function bindMissionEvents(packed) {
      const { dayNum, course } = packed;
      const videoBtn = document.getElementById("videoBtn");
      if (videoBtn) {
        videoBtn.addEventListener("click", () => window.open(course.videoUrl, "_blank", "noopener,noreferrer"));
      }
      const scout = document.getElementById("scoutedCheck");
      if (scout) {
        scout.addEventListener("change", () => {
          const key = dayKey(dayNum);
          if (scout.checked) {
            if (!progress.scoutedDays.includes(key)) progress.scoutedDays.push(key);
            saveProgress();
            missionPhase = "quiz";
            mount();
          }
        });
      }
      const heroBtn = document.getElementById("heroBtn");
      if (heroBtn) {
        heroBtn.addEventListener("click", () => {
          if (missionPhase === "video") {
            const v = document.getElementById("videoBtn");
            if (v) v.click();
            else {
              const c = document.getElementById("scoutedCheck");
              if (c) { c.checked = true; c.dispatchEvent(new Event("change")); }
            }
          } else if (missionPhase === "quiz") {
            const inp = document.getElementById("activeAnswer");
            if (inp) inp.focus();
          }
        });
      }
      if (missionPhase === "quiz") {
        bindActiveQuestion(dayNum, course, currentQIndex);
        startMissionTimerIfNeeded();
      }
      document.querySelectorAll(".day-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedDayNum = Number(btn.dataset.day);
          mount();
        });
      });
    }

    function mount() {
      if (!accountHash) return;
      const root = document.getElementById("missionRoot");
      const dayNum = getActiveDayNum();
      document.getElementById("encourageText").textContent = pickRandom(ENCOURAGE_LINES);
      refreshRankUI();
      refreshEnergyUI();
      updateMuteBtn();

      const banner = document.getElementById("welcomeBanner");
      const receiveBtn = document.getElementById("receiveCommBtn");
      const welcomeKey = String(dayNum);
      if (progress.lastWelcomeDay !== welcomeKey && !progress.clearedDays.includes(dayNum)) {
        pendingWelcomeLine = pickRandom(WELCOME_SPEECH);
        banner.hidden = false;
        document.getElementById("welcomeText").textContent = "🎙️ 长官通讯待命：" + pendingWelcomeLine;
        receiveBtn.hidden = false;
      } else {
        banner.hidden = true;
        pendingWelcomeLine = "";
      }

      const course = findCourseByDay(dayNum);
      if (!course) {
        root.dataset.mode = "empty";
        root.innerHTML = renderEmpty("作战档案尚未送达。");
        return;
      }

      if (course.type === "review") {
        root.dataset.mode = "review";
        root.innerHTML = renderReview();
        bindQuestionEvents(root, (ok) => {
          if (ok) {
            root.querySelectorAll(".question").forEach((node) => {
              if (getQState(node.dataset.qid).status === "correct") node.remove();
            });
            checkReviewClear();
          }
        });
        return;
      }

      root.dataset.mode = "mission";
      const packed = renderMission(dayNum, course);
      root.innerHTML = packed.html;
      bindMissionEvents(packed);
      if (dayQuestionDoneCount(dayNum) >= QUESTIONS_PER_DAY && !progress.clearedDays.includes(dayNum)) {
        checkDailyClear(dayNum, course);
      }
    }

    function showClearOverlay(gotBonus, elapsedSec) {
      document.getElementById("clearTitle").textContent = gotBonus ? "🎉 神速通关！" : "🎉 今日通关！";
      document.getElementById("clearMsg").textContent = gotBonus
        ? `20分钟内完成！额外获得 ${BONUS_ENERGY} 点能源奖励！`
        : "你已获得【今日数学之星】称号！";
      const bonusEl = document.getElementById("clearBonus");
      if (bonusEl) {
        if (gotBonus) {
          bonusEl.hidden = false;
          bonusEl.textContent = `⚡ 能源 +${BONUS_ENERGY}（用时 ${Math.floor(elapsedSec / 60)} 分 ${elapsedSec % 60} 秒）`;
        } else {
          bonusEl.hidden = true;
        }
      }
      document.getElementById("clearOverlay").classList.add("show");
      runConfetti();
      if (gotBonus) {
        playBgmBurst(14000, 0.38);
        enqueueVoice(() => speak("神速！20分钟内完成，能源奖励已到账！", { rate: 0.78 }));
      } else {
        playClearFanfare();
      }
      refreshEnergyUI();
    }

    /* ========== 登录 & 进度同步 ========== */
    async function sha256Hex(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    async function deriveAccountHash(name, pass) {
      return sha256Hex(`${name.trim()}:${pass}:${ACCOUNT_SALT}`);
    }

    async function exportSyncCode() {
      const payload = JSON.stringify({ v: STORAGE_VERSION, h: accountHash, p: progress });
      const key = await sha256Hex(accountHash + ":sync");
      let out = "";
      for (let i = 0; i < payload.length; i++) {
        out += String.fromCharCode(payload.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return "RA1:" + btoa(out);
    }

    async function importSyncCode(code) {
      if (!code.startsWith("RA1:")) throw new Error("无效进度码");
      const raw = atob(code.slice(4));
      const key = await sha256Hex(accountHash + ":sync");
      let json = "";
      for (let i = 0; i < raw.length; i++) {
        json += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      const data = JSON.parse(json);
      if (data.h !== accountHash) throw new Error("进度码与当前账号不匹配");
      progress = { ...defaultProgress(), ...data.p, accountName };
      saveProgress();
    }

    function showAppShell() {
      document.getElementById("loginOverlay").hidden = true;
      const chip = document.getElementById("userChip");
      chip.hidden = false;
      chip.textContent = "👤 " + accountName;
      document.getElementById("loginSyncRow").hidden = false;
      mount();
    }

    async function doLogin() {
      const name = document.getElementById("loginName").value.trim();
      const pass = document.getElementById("loginPass").value;
      if (!name || !pass) {
        alert("请输入名字和密码");
        return;
      }
      accountName = name;
      accountHash = await deriveAccountHash(name, pass);
      updateStorageKey();
      progress = loadProgress();
      progress.accountName = name;
      saveProgress();
      localStorage.setItem(SESSION_KEY, JSON.stringify({ accountHash, accountName }));
      showAppShell();
    }

    function doLogout() {
      localStorage.removeItem(SESSION_KEY);
      accountHash = "";
      accountName = "";
      progress = defaultProgress();
      document.getElementById("loginOverlay").hidden = false;
      document.getElementById("userChip").hidden = true;
      document.getElementById("loginSyncRow").hidden = true;
    }

    async function tryRestoreSession() {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return false;
      try {
        const s = JSON.parse(raw);
        if (!s.accountHash || !s.accountName) return false;
        accountHash = s.accountHash;
        accountName = s.accountName;
        updateStorageKey();
        progress = loadProgress();
        showAppShell();
        return true;
      } catch (e) {
        return false;
      }
    }

    document.getElementById("loginBtn").addEventListener("click", doLogin);
    document.getElementById("loginPass").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    document.getElementById("logoutBtn").addEventListener("click", () => {
      if (confirm("确定退出？下次需重新登录。")) doLogout();
    });
    document.getElementById("syncExportBtn").addEventListener("click", async () => {
      try {
        const code = await exportSyncCode();
        await navigator.clipboard.writeText(code);
        showToast("📋 进度码已复制！到新设备粘贴恢复。");
      } catch (e) {
        prompt("复制此进度码到新设备：", await exportSyncCode());
      }
    });
    document.getElementById("importSyncBtn").addEventListener("click", async () => {
      const code = document.getElementById("syncCodeInput").value.trim();
      if (!code) return;
      try {
        await importSyncCode(code);
        showToast("✅ 进度已恢复！");
        mount();
      } catch (e) {
        alert(e.message || "恢复失败");
      }
    });

    document.getElementById("receiveCommBtn").addEventListener("click", () => {
      const line = pendingWelcomeLine || pickRandom(WELCOME_SPEECH);
      const dayNum = getActiveDayNum();
      progress.lastWelcomeDay = String(dayNum);
      saveProgress();
      document.getElementById("welcomeText").textContent = "🎙️ 长官通讯：" + line;
      document.getElementById("receiveCommBtn").hidden = true;
      playWelcomeComm(line);
      if (!progress.enlistedSpoken && progress.correctCount === 0) {
        progress.enlistedSpoken = true;
        saveProgress();
        enqueueVoice(() => speak(PROMOTE_SPEECH[0], { file: "voice/promote-0.mp3" }));
      }
    });

    document.getElementById("resetProgressBtn").addEventListener("click", () => {
      const ok = confirm("确定清空全部进度？将从列兵、第01天重新开始。");
      if (!ok) return;
      progress = defaultProgress();
      progress.accountName = accountName;
      saveProgress();
      selectedDayNum = null;
      location.reload();
    });

    document.getElementById("muteBtn").addEventListener("click", () => setMuted(!soundMuted));

    /* ========== 倒计时 ========== */
    let timerRemain = TIMER_TOTAL_SEC;
    let timerId = null;
    let timerRunning = false;

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function updateTimerUI() {
      document.getElementById("timerDisplay").textContent = formatTime(timerRemain);
    }

    document.getElementById("timerBtn").addEventListener("click", () => {
      if (timerRunning) return;
      timerRunning = true;
      timerRemain = TIMER_TOTAL_SEC;
      timerStartedAt = Date.now();
      timerStoppedAt = null;
      updateTimerUI();
      document.getElementById("timerBtn").disabled = true;
      document.getElementById("timerBtn").textContent = "⏱️ 计时中…";
      document.getElementById("timerAlert").classList.remove("show");
      timerId = setInterval(() => {
        timerRemain -= 1;
        updateTimerUI();
        if (timerRemain <= 0) {
          stopMissionTimer();
          document.getElementById("timerAlert").classList.add("show");
          speak("时间到！任务结束，撤退休整！", { file: "voice/timer.mp3" });
        }
      }, 1000);
    });

    document.getElementById("closeOverlayBtn").addEventListener("click", () => {
      document.getElementById("clearOverlay").classList.remove("show");
      stopBgm();
      selectedDayNum = null;
      mount();
    });

    (function initDebugDay() {
      const sel = document.getElementById("debugDaySelect");
      if (!sel) return;
      courses.filter((c) => !c.type).forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c.dayNum;
        opt.textContent = `第${padDay(c.dayNum)}天`;
        sel.appendChild(opt);
      });
      document.getElementById("debugDayApply").addEventListener("click", () => {
        selectedDayNum = Number(sel.value);
        mount();
      });
    })();

    (function ensureMuteAlwaysVisible() {
      const wrap = document.querySelector(".timer-wrap");
      if (!wrap || document.getElementById("muteBtnStatus")) return;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-ghost mute-btn";
      b.id = "muteBtnStatus";
      b.textContent = soundMuted ? "🔇 音效关" : "🔊 音效开";
      b.addEventListener("click", () => {
        setMuted(!soundMuted);
        b.textContent = soundMuted ? "🔇 音效关" : "🔊 音效开";
        const other = document.getElementById("muteBtn");
        if (other) other.textContent = b.textContent;
      });
      wrap.appendChild(b);
      const orig = updateMuteBtn;
      updateMuteBtn = function () {
        orig();
        const sb = document.getElementById("muteBtnStatus");
        if (sb) sb.textContent = soundMuted ? "🔇 音效关" : "🔊 音效开";
      };
    })();

    tryRestoreSession();
  </script>
</body>
</html>
