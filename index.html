<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>四年级奥数 · 数学指挥部</title>
  <style>
    :root {
      --bg-deep: #1a2e1a;
      --bg-mid: #2d4a2d;
      --card: #2d2d2d;
      --border: #4a7a4a;
      --accent: #FF6A00;
      --text: #e0e0e0;
      --muted: #9a9a9a;
      --btn: #4a7a4a;
      --btn-hover: #5c9a5c;
      --ok: #4a7a4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 50%, #1f351f 100%);
      background-attachment: fixed;
      padding-bottom: 120px;
    }
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(10, 18, 10, 0.9);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .status-title { color: var(--accent); font-weight: 700; font-size: 1.05rem; }
    .encourage { color: #ffd08a; font-size: 0.95rem; margin-top: 4px; min-height: 1.4em; }
    .energy-chip {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      border: 1px solid var(--accent);
      color: #ffd08a;
      font-weight: 700;
      font-size: 0.85rem;
      background: rgba(255,106,0,0.12);
    }
    .rank-line { color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .rank-badge { display: inline-flex; gap: 3px; padding: 2px 6px; border: 1px solid var(--border); background: #1a1a1a; }
    .rank-bar-mark { width: 4px; height: 14px; background: #c4a574; }
    .rank-star { color: #ffd08a; }
    .rank-star.fine { font-size: 0.7rem; }
    .rank-star.gold { color: #ffcc33; font-size: 1.1rem; }
    .score-line { font-size: 0.9rem; margin-top: 4px; }
    .rank-bar { width: 180px; height: 10px; background: #1a1a1a; border: 1px solid var(--border); margin-top: 6px; overflow: hidden; }
    .rank-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--btn), var(--accent)); transition: width 0.8s ease; }
    .timer-display { color: var(--accent); font-size: 1.2rem; font-variant-numeric: tabular-nums; margin-left: 8px; }
    .timer-alert { display: none; margin-top: 8px; padding: 8px; border: 1px solid var(--accent); color: #ffd08a; }
    .timer-alert.show { display: block; }
    .toast-stack { position: fixed; top: 72px; right: 12px; z-index: 1200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast {
      min-width: 160px; padding: 12px 14px; background: rgba(20,28,20,0.95);
      border: 1px solid var(--accent); color: #ffd08a; font-weight: 700;
      opacity: 0; transform: translateX(20px); transition: opacity 0.5s, transform 0.5s;
    }
    .toast.show { opacity: 1; transform: none; }
    main { max-width: 860px; margin: 0 auto; padding: 16px 16px 24px; }
    .welcome-banner {
      margin-bottom: 14px; padding: 14px 16px; background: rgba(0,0,0,0.35);
      border-left: 4px solid var(--accent); color: #ffd08a; font-size: 1.05rem;
    }
    .welcome-banner[hidden] { display: none !important; }
    .mission-card {
      background: var(--card); border: 2px solid var(--border);
      padding: 18px 18px 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: opacity 0.8s ease;
    }
    .mission-card.waiting-welcome { opacity: 0.25; pointer-events: none; }
    .mission-title { margin: 0 0 4px; font-size: 1.4rem; color: var(--accent); }
    .mission-sub { margin: 0 0 12px; color: var(--muted); }
    .phase-tag {
      display: inline-block; padding: 4px 12px; margin: 0 8px 10px 0;
      font-size: 0.85rem; font-weight: 700; border: 1px solid var(--border);
    }
    .phase-tag.foundation { color: #7dffa0; }
    .phase-tag.advancement { color: #ffd08a; border-color: var(--accent); }
    .source-tag { display: inline-block; padding: 4px 10px; margin-bottom: 10px; font-size: 0.85rem; color: #ffd08a; border: 1px solid var(--border); }
    .day-progress-wrap { margin: 0 0 16px; }
    .day-progress-label { display: flex; justify-content: space-between; color: #ffd08a; font-size: 0.9rem; margin-bottom: 6px; }
    .day-progress-bar { height: 14px; background: #1a1a1a; border: 1px solid var(--border); overflow: hidden; }
    .day-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--btn), var(--accent)); transition: width 0.8s ease; }
    .quiz-card {
      padding: 18px; background: rgba(0,0,0,0.28); border: 2px solid var(--accent);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .quiz-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
    .quiz-dot { width: 14px; height: 14px; border-radius: 50%; background: #444; border: 2px solid #666; transition: all 0.5s; }
    .quiz-dot.done { background: var(--ok); border-color: #7dffa0; }
    .quiz-dot.current { background: var(--accent); border-color: #ffd08a; transform: scale(1.25); }
    .q-badge { color: var(--accent); font-weight: 700; margin: 0 0 8px; }
    .q-text { margin: 0 0 14px; line-height: 1.7; font-size: 1.12rem; }
    .answer-input-lg {
      width: 100%; padding: 16px; font-size: 1.3rem; text-align: center;
      background: #1a1a1a; border: 2px solid var(--border); color: var(--text);
      font-family: inherit; margin-bottom: 10px; min-height: 52px;
    }
    .answer-input-lg:focus { outline: none; border-color: var(--accent); }
    .answer-input-lg:disabled { opacity: 0.7; }
    .feedback { margin: 8px 0 0; font-weight: 700; min-height: 1.5em; animation: fadeIn 0.5s ease; }
    .feedback.ok { color: #7dffa0; }
    .feedback.bad { color: #ff8a8a; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .video-hero {
      text-align: center; padding: 22px 14px; border: 2px dashed var(--border);
      background: rgba(0,0,0,0.22); margin-bottom: 12px;
    }
    .video-meta { color: var(--muted); margin: 0 0 12px; }
    .rest-box, .empty-box, .review-empty { text-align: center; padding: 28px 12px; line-height: 1.7; font-size: 1.1rem; }
    .day-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .day-chip {
      padding: 8px 12px; min-height: 44px; border: 2px solid #555; background: #1a1a1a;
      color: var(--muted); cursor: pointer; font-family: inherit; font-size: 0.85rem;
    }
    .day-chip.current { border-color: var(--accent); color: #ffd08a; }
    .day-chip.cleared { border-color: var(--ok); color: #7dffa0; }
    .parent-debug { margin-top: 8px; opacity: 0.45; font-size: 0.75rem; }
    .parent-debug select, .parent-debug button {
      font-size: 0.8rem; padding: 4px 8px; background: #1a1a1a; color: var(--text);
      border: 1px solid var(--border); font-family: inherit;
    }
    .btn {
      appearance: none; border: 2px solid #6b8f6b; background: var(--btn); color: #f5f5f5;
      font-size: 1rem; font-weight: 700; padding: 12px 16px; min-height: 44px;
      cursor: pointer; font-family: inherit; text-decoration: none; display: inline-flex;
      align-items: center; justify-content: center; text-align: center;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-orange { background: var(--accent); border-color: #ffb366; color: #111; }
    .btn-ghost { background: #3a3a3a; border-color: var(--border); color: var(--text); }
    .reset-btn { font-size: 0.75rem !important; padding: 6px 10px !important; min-height: 36px; opacity: 0.8; margin-top: 6px; }

    /* Red Alert command bar */
    .command-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
      background: rgba(18, 28, 18, 0.96); border-top: 3px solid var(--accent);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 24px rgba(0,0,0,0.45);
    }
    .command-bar-inner {
      max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    }
    .command-bar .btn { flex: 1 1 120px; max-width: 180px; }

    .overlay, .brief-overlay, .guide-overlay, .history-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .overlay.show, .brief-overlay.show, .guide-overlay.show, .history-overlay.show { display: flex; }
    .overlay-panel, .brief-panel, .history-panel {
      background: var(--card); border: 3px solid var(--accent); padding: 22px; max-width: 520px; width: 100%;
      max-height: 90vh; overflow: auto; position: relative; z-index: 2;
    }
    .history-panel { max-width: 560px; }
    .history-list { list-style: none; margin: 0; padding: 0; }
    .history-list li {
      display: flex; justify-content: space-between; gap: 10px; align-items: center;
      padding: 12px; border: 1px solid var(--border); margin-bottom: 10px; background: rgba(0,0,0,0.25);
    }
    .history-list button { min-height: 44px; }
    #confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    .brief-caption { color: #ffd08a; min-height: 1.4em; margin: 0 0 8px; }
    .brief-stage { min-height: 160px; margin: 10px 0 14px; padding: 14px; background: #1a1a1a; border: 1px solid var(--border); }
    .brief-formulas { list-style: none; margin: 0; padding: 0; }
    .brief-formulas li {
      opacity: 0.25; transform: translateX(-8px);
      transition: opacity 0.8s, transform 0.8s, background 0.5s;
      padding: 8px 10px; margin-bottom: 6px; border-left: 3px solid transparent;
    }
    .brief-formulas li.show { opacity: 1; transform: none; border-left-color: var(--accent); background: rgba(255,106,0,0.08); }
    .brief-formulas li.active { border-left-color: #7dffa0; background: rgba(74,122,74,0.2); }
    .brief-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    .bar-label { width: 5.5em; flex-shrink: 0; color: #ffd08a; font-size: 0.9rem; }
    .bar-track { flex: 1; height: 28px; background: #111; border: 1px solid #555; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4a7a4a, #6aaa6a); transition: width 0.8s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-weight: 700; font-size: 0.85rem; }
    .bar-fill.more { background: linear-gradient(90deg, #a34500, var(--accent)); }
    .seg-row { display: flex; gap: 4px; flex-wrap: wrap; margin: 12px 0; }
    .seg { width: 36px; height: 36px; border: 2px solid var(--border); background: #333; opacity: 0; transform: scale(0.6); transition: opacity 0.5s, transform 0.5s; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
    .seg.show { opacity: 1; transform: scale(1); }
    .seg.hi { background: var(--accent); border-color: #ffb366; color: #111; }
    .tree-line { position: relative; height: 48px; margin: 28px 8px 8px; border-bottom: 3px solid #8B7355; }
    .tree-dot { position: absolute; bottom: -7px; width: 14px; height: 14px; border-radius: 50%; background: #555; border: 2px solid #aaa; transform: scale(0); transition: transform 0.5s ease, background 0.5s; }
    .tree-dot.show { transform: scale(1); background: var(--accent); border-color: #ffd08a; }
    .tree-dot.ghost { background: transparent; border-style: dashed; opacity: 0.5; }
    .eq-box { text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--accent); padding: 16px; }
    .eq-box .pop { display: inline-block; animation: popIn 0.8s ease; }
    @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Guide */
    .guide-overlay { background: rgba(0,0,0,0.72); z-index: 1500; align-items: flex-start; justify-content: center; padding-top: 18vh; }
    .guide-overlay[hidden] { display: none !important; }
    .guide-card {
      background: var(--card); border: 3px solid var(--accent); padding: 20px; max-width: 420px; text-align: center; z-index: 1502;
    }
    .guide-card p { margin: 0 0 14px; color: #ffd08a; font-size: 1.1rem; line-height: 1.6; }
    .guide-highlight {
      position: relative; z-index: 1501 !important;
      box-shadow: 0 0 0 4px var(--accent), 0 0 24px rgba(255,106,0,0.8) !important;
      animation: guidePulse 1s ease-in-out infinite;
    }
    @keyframes guidePulse {
      0%, 100% { box-shadow: 0 0 0 4px var(--accent), 0 0 16px rgba(255,106,0,0.6); }
      50% { box-shadow: 0 0 0 8px #ffb366, 0 0 28px rgba(255,106,0,0.95); }
    }
    .readonly-banner {
      margin-bottom: 12px; padding: 10px 12px; border: 1px solid var(--accent);
      color: #ffd08a; background: rgba(255,106,0,0.1); font-weight: 700;
    }
    .question {
      margin-top: 14px; padding: 14px; background: rgba(0,0,0,0.28); border: 1px solid #555;
    }
    .answer-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .answer-input {
      flex: 1 1 140px; min-height: 44px; padding: 12px; font-size: 1.1rem;
      background: #1a1a1a; border: 2px solid var(--border); color: var(--text); font-family: inherit;
    }
    @media (max-width: 600px) {
      .mission-title { font-size: 1.2rem; }
      .command-bar .btn { flex: 1 1 44%; max-width: none; font-size: 0.92rem; padding: 10px 8px; }
      main { padding-bottom: 160px; }
    }
  </style>
</head>
<body>
  <header class="status-bar">
    <div>
      <div class="status-title">📡 数学指挥部</div>
      <div class="encourage" id="encourageText"></div>
      <span class="energy-chip" id="energyChip">⚡ 能源 0</span>
      <div style="margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
        <span class="timer-display" id="timerDisplay">30:00</span>
      </div>
      <div class="timer-alert" id="timerAlert">⏰ 三题全部攻克！任务结束，撤退休整！</div>
      <div class="parent-debug">
        <span>家长调试</span>
        <select id="debugDaySelect"></select>
        <button type="button" id="debugDayApply">切换</button>
      </div>
    </div>
    <div>
      <div class="rank-line"><span class="rank-badge" id="rankBadge"></span><span id="rankName">🪖 列兵</span></div>
      <div class="score-line" id="scoreLabel">战果：0/3</div>
      <div class="rank-bar"><div class="rank-bar-fill" id="rankBarFill"></div></div>
      <button type="button" class="btn btn-ghost reset-btn" id="historyOpenBtn">📅 历史任务</button>
      <button type="button" class="btn btn-ghost reset-btn" id="muteBtn">🔊 音效开</button>
      <button type="button" class="btn btn-ghost reset-btn" id="resetProgressBtn">🔄 重置进度</button>
    </div>
  </header>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <main>
    <div class="welcome-banner" id="welcomeBanner" hidden>
      <span id="welcomeText"></span>
    </div>
    <section class="mission-card waiting-welcome" id="missionRoot"></section>
  </main>

  <nav class="command-bar" id="commandBar" aria-label="作战命令栏">
    <div class="command-bar-inner">
      <button type="button" class="btn btn-orange" id="timerBtn">⏱️ 开始行动</button>
      <a class="btn btn-ghost" id="cmdVideoBtn" href="#" target="_blank" rel="noopener noreferrer">🎬 前往B站观看</a>
      <button type="button" class="btn btn-ghost" id="cmdPrevBtn">⏪ 上一题</button>
      <button type="button" class="btn btn-ghost" id="cmdNextBtn">⏩ 下一题</button>
      <button type="button" class="btn btn-orange" id="cmdCheckBtn">✅ 确认战果</button>
      <button type="button" class="btn btn-ghost" id="cmdHintBtn">📢 听讲解</button>
    </div>
  </nav>

  <audio id="bgmAudio" src="lemonmusicstudio-the-destroyer-109436.mp3" preload="auto" loop></audio>

  <div class="overlay" id="clearOverlay" role="dialog" aria-modal="true">
    <canvas id="confetti-canvas"></canvas>
    <div class="overlay-panel">
      <h2 id="clearTitle" style="color:var(--accent);margin:0 0 12px;">🎉 今日通关！</h2>
      <p id="clearMsg">你已获得【今日数学之星】称号！</p>
      <p id="clearBonus" hidden style="color:#ffd08a;font-weight:700;"></p>
      <button type="button" class="btn btn-orange" id="closeOverlayBtn" style="margin-top:12px;">继续指挥</button>
    </div>
  </div>

  <div class="brief-overlay" id="briefOverlay" role="dialog" aria-modal="true" aria-labelledby="briefTitle">
    <div class="brief-panel">
      <h2 id="briefTitle" style="color:var(--accent);margin:0 0 8px;">📢 长官战术讲解</h2>
      <p class="brief-caption" id="briefCaption">正在接通战术频道……</p>
      <div class="brief-stage" id="briefStage"></div>
      <ol class="brief-formulas" id="briefFormulas"></ol>
      <div class="brief-actions">
        <button type="button" class="btn btn-orange" id="briefReplayBtn">🔄 再讲一遍</button>
        <button type="button" class="btn btn-ghost" id="briefCloseBtn">收到，关闭</button>
      </div>
    </div>
  </div>

  <div class="history-overlay" id="historyOverlay" role="dialog" aria-modal="true">
    <div class="history-panel">
      <h2 style="color:var(--accent);margin:0 0 12px;">📅 历史任务</h2>
      <ul class="history-list" id="historyList"></ul>
      <button type="button" class="btn btn-ghost" id="historyCloseBtn" style="width:100%;margin-top:8px;">关闭</button>
    </div>
  </div>

  <div class="guide-overlay" id="guideOverlay" hidden>
    <div class="guide-card">
      <p id="guideText">先点击这里开始今日任务！</p>
      <button type="button" class="btn btn-orange" id="guideNextBtn">下一步</button>
    </div>
  </div>

  <script>

    const STORAGE_KEY = "redAlert_progress";
    const GUIDE_KEY = "redAlert_guide_done_v1";
    const MAX_RANK_SCORE = 74;
    const QUESTIONS_PER_DAY = 3;
    const TIMER_TOTAL_SEC = 30 * 60;
    const BONUS_TIME_SEC = 20 * 60;
    const BONUS_ENERGY = 10;

    let selectedDayNum = null;
    let missionPhase = "video";
    let currentQIndex = 0;
    let timerStartedAt = null;
    let timerStoppedAt = null;
    let historyReadonly = false;
    let welcomeGateDone = false;
    let advanceTimer = null;
    let activeCourse = null;
    let activeDayNum = 1;

    // 后面那张表：真实军官制 14 级
    const RANKS = [
      { name: "列兵", need: 0, icon: "🪖", bars: 0, stars: 0, fineStar: false, gold: false },
      { name: "上等兵", need: 3, icon: "🪖", bars: 1, stars: 0, fineStar: false, gold: false },
      { name: "下士", need: 6, icon: "🎖️", bars: 1, stars: 1, fineStar: false, gold: false },
      { name: "中士", need: 10, icon: "🎖️", bars: 2, stars: 0, fineStar: false, gold: false },
      { name: "上士", need: 14, icon: "🎖️", bars: 3, stars: 0, fineStar: false, gold: false },
      { name: "准尉", need: 18, icon: "🎖️", bars: 1, stars: 0, fineStar: true, gold: false },
      { name: "少尉", need: 23, icon: "🎖️", bars: 1, stars: 1, fineStar: false, gold: false },
      { name: "中尉", need: 28, icon: "🎖️", bars: 1, stars: 2, fineStar: false, gold: false },
      { name: "上尉", need: 34, icon: "🎖️", bars: 1, stars: 3, fineStar: false, gold: false },
      { name: "少校", need: 40, icon: "🎖️", bars: 2, stars: 1, fineStar: false, gold: false },
      { name: "中校", need: 47, icon: "🎖️", bars: 2, stars: 2, fineStar: false, gold: false },
      { name: "上校", need: 55, icon: "🎖️", bars: 2, stars: 3, fineStar: false, gold: false },
      { name: "大校", need: 64, icon: "🎖️", bars: 2, stars: 4, fineStar: false, gold: false },
      { name: "少将", need: 74, icon: "🏅", bars: 0, stars: 0, fineStar: false, gold: true }
    ];

    const PROMOTE_SPEECH = {
      0: "欢迎入伍，新兵！证明给我看。",
      1: "不错，你已经开始像个兵了。",
      2: "晋升下士！继续冲锋。",
      3: "中士！你是队伍的脊梁。",
      4: "上士！离军官只有一步之遥。",
      5: "准尉！你已经有了军官的气质。",
      6: "少尉！这是你的第一颗将星，记住今天。",
      7: "中尉！两颗星了，继续闪耀。",
      8: "上尉！三颗星，你已经是指挥官了。",
      9: "少校！校官行列，欢迎你。",
      10: "中校！两颗星，威信日增。",
      11: "上校！三颗星，你是战场的主宰。",
      12: "大校！四颗星，将军在向你招手。",
      13: "少将！！将军！你是真正的领袖！"
    };

      if (!window.speechSynthesis || !text) return Promise.resolve();
      const voice = pickCommanderVoice();
      if (!voice || scoreMaleVoice(voice) < 40) return Promise.resolve();
      return new Promise((resolve) => {
        try {
          window.speechSynthesis.cancel();
          duckBgmForSpeech();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "zh-CN";
          u.rate = (opts && opts.rate) != null ? opts.rate : 0.78;
          u.pitch = (opts && opts.pitch) != null ? opts.pitch : 0.72;
          u.volume = 1;
          u.voice = voice;
          u.onend = () => resolve();
          u.onerror = () => resolve();
          window.speechSynthesis.speak(u);
        } catch (e) { resolve(); }
      });
    }
    function speak(text, opts) {
      if (soundMuted || !text) return Promise.resolve();
      if (opts && opts.file) {
        return playVoiceFile(opts.file).then((ok) => {
          if (ok) return;
          return speakSynth(text, opts);
        });
      }
      return speakSynth(text, opts);
    }
    function enqueueVoice(fn) {
      voiceChain = voiceChain.then(() => fn()).catch(() => {});
      return voiceChain;
    }
    function playWelcomeComm(line) {
      const idx = Math.max(0, WELCOME_SPEECH.indexOf(line));
      const file = `voice/welcome-${idx >= 0 ? idx : 0}.mp3`;
      playBgmBurst(16000, 0.34);
      return enqueueVoice(() => speak(line, { file }));
    }
    function playClearFanfare() {
      playBgmBurst(12000, 0.38);
      return enqueueVoice(() =>
        speak("完美！今日任务全部完成，你证明了自己！", { file: "voice/clear.mp3" })
      );
    }

    let briefToken = 0;
    let briefCurrentQ = null;

    function buildBriefing(q) {
      const ex = q.ex;
      if (!ex) {
        return {
          steps: [
            {
              say: "士兵，听好了。" + (q.hint || "仔细审题，找到已知条件。"),
              formula: q.hint || "",
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${escapeHtml(String(q.answer))}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "sd") {
        const less = (ex.S - ex.D) / 2;
        const more = less + ex.D;
        const max = Math.max(more, less, 1);
        return {
          steps: [
            {
              say: `士兵，看战术板。${ex.A}和${ex.B}一共${ex.S}。`,
              formula: `${ex.A} + ${ex.B} = ${ex.S}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.A)}</span><div class="bar-track"><div class="bar-fill more" id="bA"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>
                  <div class="eq-box">合计 ${ex.S}</div>`;
                requestAnimationFrame(() => {
                  document.getElementById("bA").style.width = "70%";
                  document.getElementById("bB").style.width = "55%";
                });
              }
            },
            {
              say: `${ex.A}比${ex.B}多${ex.D}。先把多出来的${ex.D}拿掉，两边就一样长了。`,
              formula: `${ex.S} − ${ex.D} = ${ex.S - ex.D}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.A)}</span><div class="bar-track"><div class="bar-fill more" id="bA" style="width:${(more/max)*100}%"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB" style="width:${(less/max)*100}%"></div></div></div>
                  <div class="eq-box">多出的 ${ex.D} 先拿掉 → 剩下 ${ex.S - ex.D}</div>`;
              }
            },
            {
              say: `剩下的${ex.S - ex.D}平分，每边是${less}。这就是${ex.B}。`,
              formula: `(${ex.S} − ${ex.D}) ÷ 2 = ${less}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB2"></div></div></div>
                  <div class="eq-box pop">各 ${less}</div>`;
                requestAnimationFrame(() => {
                  const w = (less / max) * 100 + "%";
                  document.getElementById("bB").style.width = w;
                  document.getElementById("bB2").style.width = w;
                });
              }
            },
            {
              say: ex.want === "B"
                ? `所以${ex.B}是${less}。记住：和差问题，先减差再平分。`
                : ex.want === "both"
                  ? `${ex.A}就是${less}加${ex.D}，等于${more}。答案是${more}和${less}。`
                  : `${ex.A}是${less}加${ex.D}，等于${more}。目标锁定！`,
              formula: ex.want === "B"
                ? `${ex.B} = ${less}`
                : ex.want === "both"
                  ? `${ex.A}=${more}，${ex.B}=${less}`
                  : `${ex.A} = ${less} + ${ex.D} = ${more}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.A)}</span><div class="bar-track"><div class="bar-fill more" id="bA"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>
                  <div class="eq-box"><span class="pop">${ex.want === "B" ? less : ex.want === "both" ? more + " , " + less : more}</span></div>`;
                requestAnimationFrame(() => {
                  document.getElementById("bA").style.width = (more / max) * 100 + "%";
                  document.getElementById("bA").textContent = more;
                  document.getElementById("bB").style.width = (less / max) * 100 + "%";
                  document.getElementById("bB").textContent = less;
                });
              }
            }
          ]
        };
      }

      if (ex.t === "sm") {
        // (S+D)/2 = more
        const more = (ex.S + ex.D) / 2;
        const less = more - ex.D;
        return buildBriefing({ ...q, ex: { t: "sd", A: ex.A, B: ex.B, S: ex.S, D: ex.D, want: "A" } });
      }

      if (ex.t === "give") {
        const diff = ex.A - ex.B;
        const half = diff / 2;
        return {
          steps: [
            {
              say: `士兵，${ex.A}有${ex.Xa}，${ex.B}有${ex.Xb}。差是${diff}。`,
              formula: `${ex.Xa} − ${ex.Xb} = ${diff}`,
              paint: (stage) => {
                const max = Math.max(ex.Xa, ex.Xb);
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.A)}</span><div class="bar-track"><div class="bar-fill more" id="bA"></div></div></div>
                  <div class="bar-row"><span class="bar-label">${escapeHtml(ex.B)}</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>`;
                requestAnimationFrame(() => {
                  document.getElementById("bA").style.width = (ex.Xa / max) * 100 + "%";
                  document.getElementById("bA").textContent = ex.Xa;
                  document.getElementById("bB").style.width = (ex.Xb / max) * 100 + "%";
                  document.getElementById("bB").textContent = ex.Xb;
                });
              }
            },
            {
              say: `要一样多，把差的一半交给对方。一半是${half}。`,
              formula: `${diff} ÷ 2 = ${half}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">差 ${diff} → 给出一半 <span class="pop">${half}</span></div>
                  <div class="seg-row">${Array.from({length: diff}, (_,i) => `<div class="seg ${i<half?"hi":""}" id="g${i}"></div>`).join("")}</div>`;
                requestAnimationFrame(() => {
                  for (let i = 0; i < diff; i++) {
                    setTimeout(() => document.getElementById("g" + i).classList.add("show"), i * 80);
                  }
                });
              }
            },
            {
              say: `所以从${ex.A}拿出${half}给${ex.B}，两边就扳平了。`,
              formula: `给出 ${half}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">给出 ${half}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "mul") {
        return {
          steps: [
            {
              say: `士兵，这是倍数侦察。${ex.A}是${ex.Xa}，${ex.B}是${ex.Xb}。`,
              formula: `${ex.A}=${ex.Xa}，${ex.B}=${ex.Xb}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="seg-row" id="segs"></div><div class="eq-box">${escapeHtml(ex.A)} ÷ ${escapeHtml(ex.B)}</div>`;
                const box = document.getElementById("segs");
                for (let i = 0; i < ex.Xa; i++) {
                  const d = document.createElement("div");
                  d.className = "seg";
                  d.textContent = i < ex.Xb ? "B" : "A";
                  if (i >= ex.Xb) d.classList.add("hi");
                  box.appendChild(d);
                  setTimeout(() => d.classList.add("show"), i * 50);
                }
              }
            },
            {
              say: `${ex.Xa}除以${ex.Xb}，等于${ex.Xa / ex.Xb}倍。命中。`,
              formula: `${ex.Xa} ÷ ${ex.Xb} = ${ex.Xa / ex.Xb}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${ex.Xa / ex.Xb} 倍</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "cd") {
        const small = ex.D / (ex.K - 1);
        const big = small * ex.K;
        return {
          steps: [
            {
              say: `差倍战术：${ex.A}是${ex.B}的${ex.K}倍，又多${ex.D}。`,
              formula: `${ex.A} = ${ex.K} × ${ex.B}，${ex.A} − ${ex.B} = ${ex.D}`,
              paint: (stage) => {
                let html = `<div class="seg-row">`;
                for (let i = 0; i < ex.K; i++) html += `<div class="seg hi" id="c${i}"></div>`;
                html += `</div><div class="eq-box">${ex.K} 份里，多出的是 ${ex.K - 1} 份</div>`;
                stage.innerHTML = html;
                requestAnimationFrame(() => {
                  for (let i = 0; i < ex.K; i++) setTimeout(() => document.getElementById("c" + i).classList.add("show"), i * 120);
                });
              }
            },
            {
              say: `多出来的${ex.D}，正好是${ex.K - 1}份。所以一份是${small}。`,
              formula: `${ex.D} ÷ (${ex.K} − 1) = ${small}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">每份 = <span class="pop">${small}</span></div>`;
              }
            },
            {
              say: ex.want === "A"
                ? `${ex.A}有${ex.K}份，是${big}。`
                : `${ex.B}就是一份，等于${small}。目标确认！`,
              formula: ex.want === "A" ? `${ex.A} = ${small} × ${ex.K} = ${big}` : `${ex.B} = ${small}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${ex.want === "A" ? big : small}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "hb") {
        const small = ex.S / (ex.K + 1);
        const big = small * ex.K;
        return {
          steps: [
            {
              say: `和倍作战：一共${ex.S}，${ex.A}是${ex.B}的${ex.K}倍。把总数分成${ex.K + 1}份。`,
              formula: `总份数 = ${ex.K} + 1 = ${ex.K + 1}`,
              paint: (stage) => {
                let html = `<div class="seg-row">`;
                for (let i = 0; i < ex.K + 1; i++) {
                  html += `<div class="seg ${i < ex.K ? "hi" : ""}" id="h${i}">${i < ex.K ? "A" : "B"}</div>`;
                }
                html += `</div><div class="eq-box">共 ${ex.K + 1} 份 = ${ex.S}</div>`;
                stage.innerHTML = html;
                requestAnimationFrame(() => {
                  for (let i = 0; i < ex.K + 1; i++) setTimeout(() => document.getElementById("h" + i).classList.add("show"), i * 100);
                });
              }
            },
            {
              say: `${ex.S}除以${ex.K + 1}，一份是${small}。这就是${ex.B}。`,
              formula: `${ex.S} ÷ ${ex.K + 1} = ${small}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">每份 <span class="pop">${small}</span> = ${escapeHtml(ex.B)}</div>`;
              }
            },
            {
              say: ex.want === "A" ? `${ex.A}有${ex.K}份，是${big}。` : `所以${ex.B}是${small}。漂亮。`,
              formula: ex.want === "A" ? `${ex.A} = ${small}×${ex.K} = ${big}` : `${ex.B} = ${small}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${ex.want === "A" ? big : small}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "hbm") {
        // parts like [2,1,1] sum S
        const totalParts = ex.parts.reduce((a, b) => a + b, 0);
        const one = ex.S / totalParts;
        const ans = Math.round(one); // for the 26 case they use integer
        const exact = ex.exact != null ? ex.exact : one;
        return {
          steps: [
            {
              say: `多部队联合作战。按倍数分成${ex.parts.join("、")}份，总共${totalParts}份。`,
              formula: `份数：${ex.parts.join(" + ")} = ${totalParts}`,
              paint: (stage) => {
                let html = `<div class="seg-row">`;
                let idx = 0;
                ex.parts.forEach((p, pi) => {
                  for (let i = 0; i < p; i++) {
                    html += `<div class="seg ${pi === 0 ? "hi" : ""}" id="m${idx}">${pi + 1}</div>`;
                    idx++;
                  }
                });
                html += `</div>`;
                stage.innerHTML = html;
                requestAnimationFrame(() => {
                  for (let i = 0; i < totalParts; i++) setTimeout(() => document.getElementById("m" + i).classList.add("show"), i * 80);
                });
              }
            },
            {
              say: `${ex.S}除以${totalParts}，大约每份${Number.isInteger(one) ? one : one.toFixed(1)}。题目要求取整，第三支是${exact}。`,
              formula: `${ex.S} ÷ ${totalParts} ≈ ${exact}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${exact}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "tree") {
        const segs = ex.L / ex.G;
        const n = ex.mode === "none" ? segs - 1 : segs + 1;
        return {
          steps: [
            {
              say: `防线长${ex.L}米，每隔${ex.G}米一个点。先算段数：${ex.L}除以${ex.G}等于${segs}段。`,
              formula: `${ex.L} ÷ ${ex.G} = ${segs}（段）`,
              paint: (stage) => {
                const count = segs + 1;
                let html = `<div class="tree-line">`;
                for (let i = 0; i < count; i++) {
                  const left = (i / (count - 1)) * 100;
                  const ghost = ex.mode === "none" && (i === 0 || i === count - 1);
                  html += `<div class="tree-dot ${ghost ? "ghost" : ""}" id="t${i}" style="left:calc(${left}% - 7px)"></div>`;
                }
                html += `</div><div class="eq-box">${segs} 段</div>`;
                stage.innerHTML = html;
              }
            },
            {
              say: ex.mode === "none"
                ? `两端都不建，点数等于段数减一：${segs}减1等于${n}。`
                : `两端都建，点数等于段数加一：${segs}加1等于${n}。`,
              formula: ex.mode === "none" ? `${segs} − 1 = ${n}` : `${segs} + 1 = ${n}`,
              paint: (stage) => {
                const count = segs + 1;
                let html = `<div class="tree-line">`;
                for (let i = 0; i < count; i++) {
                  const left = (i / (count - 1)) * 100;
                  const skip = ex.mode === "none" && (i === 0 || i === count - 1);
                  html += `<div class="tree-dot ${skip ? "ghost" : ""}" id="t${i}" style="left:calc(${left}% - 7px)"></div>`;
                }
                html += `</div><div class="eq-box"><span class="pop">${n} 座</span></div>`;
                stage.innerHTML = html;
                requestAnimationFrame(() => {
                  for (let i = 0; i < count; i++) {
                    const skip = ex.mode === "none" && (i === 0 || i === count - 1);
                    if (!skip) setTimeout(() => document.getElementById("t" + i).classList.add("show"), i * 100);
                  }
                });
              }
            }
          ]
        };
      }

      if (ex.t === "digit") {
        const tens = (ex.S + ex.D) / 2;
        const ones = tens - ex.D;
        return {
          steps: [
            {
              say: `密码破译：十位与个位之和${ex.S}，十位比个位大${ex.D}。这就是和差。`,
              formula: `十位 + 个位 = ${ex.S}，十位 − 个位 = ${ex.D}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">□ □</div>`;
              }
            },
            {
              say: `十位等于和加差再除以2：${tens}。个位是${ones}。密码是${tens}${ones}。`,
              formula: `十位=(${ex.S}+${ex.D})÷2=${tens}，个位=${ones}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box"><span class="pop">${tens}${ones}</span></div>`;
              }
            }
          ]
        };
      }

      if (ex.t === "stair") {
        const c = (ex.S - ex.d1 - ex.d2) / 3;
        return {
          steps: [
            {
              say: `三座军火库像台阶一样：甲最高，乙居中，丙最低。甲比丙多${ex.d1}，乙比丙多${ex.d2}。设丙为基准。`,
              formula: `丙 = x，乙 = x+${ex.d2}，甲 = x+${ex.d1}`,
              paint: (stage) => {
                stage.innerHTML = `
                  <div class="bar-row"><span class="bar-label">甲</span><div class="bar-track"><div class="bar-fill more" id="bA"></div></div></div>
                  <div class="bar-row"><span class="bar-label">乙</span><div class="bar-track"><div class="bar-fill" id="bB"></div></div></div>
                  <div class="bar-row"><span class="bar-label">丙</span><div class="bar-track"><div class="bar-fill" id="bC"></div></div></div>`;
                requestAnimationFrame(() => {
                  document.getElementById("bA").style.width = "90%";
                  document.getElementById("bB").style.width = "70%";
                  document.getElementById("bC").style.width = "50%";
                });
              }
            },
            {
              say: `三个加起来共${ex.S}吨。丙等于（${ex.S}减去${ex.d1}再减去${ex.d2}）再除以3，等于${c}。`,
              formula: `丙 = (${ex.S}-${ex.d1}-${ex.d2}) ÷ 3 = ${c}`,
              paint: (stage) => {
                stage.innerHTML = `<div class="eq-box">丙 = <span class="pop">${c}</span></div>`;
              }
            }
          ]
        };
      }

      return buildBriefing({ ...q, ex: null });
    }

    async function runBriefing(q, meta) {
      const token = ++briefToken;
      const frozenMeta = meta ? { dayNum: meta.dayNum, index: meta.index, course: meta.course } : null;
      const frozenQ = q;
      briefCurrentQ = { q: frozenQ, meta: frozenMeta };
      const { steps } = buildBriefing(frozenQ);
      const overlay = document.getElementById("briefOverlay");
      const stage = document.getElementById("briefStage");
      const formulas = document.getElementById("briefFormulas");
      const caption = document.getElementById("briefCaption");
      const titleEl = document.getElementById("briefTitle");
      if (titleEl && frozenMeta && frozenMeta.dayNum != null) {
        titleEl.textContent = `📢 长官讲解 · 第${padDay(frozenMeta.dayNum)}天 第${frozenMeta.index + 1}题`;
      } else if (titleEl) {
        titleEl.textContent = "📢 长官战术讲解";
      }
      overlay.classList.add("show");
      formulas.innerHTML = steps.map((s) => `<li>${escapeHtml(s.formula)}</li>`).join("");
      stage.innerHTML = "";
      caption.textContent = "长官频道已接通（云扬男声）……";

      const idBase =
        frozenMeta && frozenMeta.dayNum != null
          ? `d${frozenMeta.dayNum}-q${frozenMeta.index}`
          : null;

      for (let i = 0; i < steps.length; i++) {
        if (token !== briefToken) return;
        const step = steps[i];
        const lis = formulas.querySelectorAll("li");
        lis.forEach((li, idx) => {
          li.classList.toggle("show", idx <= i);
          li.classList.toggle("active", idx === i);
        });
        caption.textContent = step.say;
        if (step.paint) step.paint(stage);
        await sleep(800);
        if (token !== briefToken) return;
        const stepFile = idBase ? `voice/brief/${idBase}-s${i}.mp3` : null;
        await speak(step.say, { file: stepFile, rate: 0.76, pitch: 0.7 });
        if (token !== briefToken) return;
        await sleep(500);
      }
      caption.textContent = "讲解完毕。听懂了就去瞄准目标！";
      await speak("讲解完毕。听懂了就去瞄准目标！", {
        file: "voice/brief-end.mp3",
        rate: 0.78,
        pitch: 0.7
      });
    }

    function closeBriefing() {
      briefToken++;
      stopVoicePlayer();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      document.getElementById("briefOverlay").classList.remove("show");
    }

    document.getElementById("briefCloseBtn").addEventListener("click", closeBriefing);
    document.getElementById("briefReplayBtn").addEventListener("click", () => {
      if (briefCurrentQ) runBriefing(briefCurrentQ.q, briefCurrentQ.meta);
    });
    document.getElementById("briefOverlay").addEventListener("click", (e) => {
      if (e.target.id === "briefOverlay") closeBriefing();
    });


    function renderRankBadge(rank) {
      if (rank.gold) return '<span class="rank-star gold">★</span>';
      let html = "";
      for (let i = 0; i < rank.bars; i++) html += '<span class="rank-bar-mark"></span>';
      if (rank.fineStar) html += '<span class="rank-star fine">✦</span>';
      for (let i = 0; i < rank.stars; i++) html += '<span class="rank-star">★</span>';
      return html || '<span style="opacity:0.35;font-size:0.75rem;">新兵</span>';
    }
    function showToast(text) {
      const stack = document.getElementById("toastStack");
      if (!stack) return;
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = text;
      stack.appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
      setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 500); }, 2200);
    }
    function refreshEnergyUI() {
      const chip = document.getElementById("energyChip");
      if (chip) chip.textContent = `⚡ 能源 ${progress.energy || 0}`;
    }
    function refreshDayProgressUI(dayNum) {
      const done = dayQuestionDoneCount(dayNum);
      const label = document.getElementById("dayProgressLabel");
      const fill = document.getElementById("dayProgressFill");
      if (label) label.innerHTML = `<span>今日战果</span><span>${done}/${QUESTIONS_PER_DAY}</span>`;
      if (fill) fill.style.width = `${(done / QUESTIONS_PER_DAY) * 100}%`;
    }
    function refreshRankUI() {
      const count = progress.correctCount;
      const idx = getRankIndex(count);
      const rank = RANKS[idx];
      const next = nextRankNeed(count);
      const badge = document.getElementById("rankBadge");
      const nameEl = document.getElementById("rankName");
      if (badge) badge.innerHTML = renderRankBadge(rank);
      if (nameEl) nameEl.textContent = `${rank.icon} ${rank.name}`;

        idx >= RANKS.length - 1 ? `战果：${count}/${MAX_RANK_SCORE}（已达少将）` : `战果：${count}/${next}`;
      document.getElementById("rankBarFill").style.width = Math.min(100, (count / MAX_RANK_SCORE) * 100) + "%";
    }
    function maybePromote(oldCount, newCount) {
      const oldIdx = getRankIndex(oldCount);
      const newIdx = getRankIndex(newCount);
      if (newIdx > oldIdx) {
        for (let i = oldIdx + 1; i <= newIdx; i++) {
          if (!progress.promotedAnnounced.includes(i)) {
            progress.promotedAnnounced.push(i);
            saveProgress();
            const line = PROMOTE_SPEECH[i];
            if (line) enqueueVoice(() => speak(line, { file: `voice/promote-${i}.mp3` }));
          }
        }
      }
      refreshRankUI();
    }

    let confettiTimer = null;
    function runConfetti(durationMs = 3500) {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
        w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
        vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4,
        rot: Math.random() * Math.PI, vr: -0.2 + Math.random() * 0.4,
        color: ["#FF6A00", "#ffd08a", "#4a7a4a", "#e0e0e0"][Math.floor(Math.random() * 4)]
      }));
      const start = performance.now();
      cancelAnimationFrame(confettiTimer);
      function frame(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p) => {
          p.x += p.vx; p.y += p.vy; p.rot += p.vr;
          if (p.y > canvas.height) p.y = -20;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
        });
        if (now - start < durationMs) confettiTimer = requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      confettiTimer = requestAnimationFrame(frame);
    }


    function clearAdvanceTimer() {
      if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    }
    function playHitStreak(hitIndex) {
      const speechIdx = Math.min(Math.max(hitIndex, 0), HIT_SPEECH.length - 1);
      showToast(HIT_TOAST[speechIdx]);
      playBgmBurst(4500 + speechIdx * 900, 0.28 + speechIdx * 0.03);
      enqueueVoice(() => speak(HIT_SPEECH[speechIdx], { file: `voice/hit-${speechIdx}.mp3` }));
    }
    function markCorrect(id, hitIndex) {
      const prev = getQState(id);
      const oldCount = progress.correctCount;
      let first = prev.firstCorrect;
      if (!first) {
        first = true;
        progress.correctCount += 1;
        saveProgress();
      } else {
        refreshRankUI();
      }
      setQState(id, { status: "correct", firstCorrect: true });
      removeWrong(id);
      playHitStreak(hitIndex);
      if (first) maybePromote(oldCount, progress.correctCount);
    }
    function speakMissEncourage() {
      const idx = Math.floor(Math.random() * MISS_SPEECH.length);
      const line = MISS_SPEECH[idx];
      showToast(line);
      return speak(line, { file: `voice/miss-${idx}.mp3` });
    }
    function stopMissionTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; }
      timerRunning = false;
      timerStoppedAt = Date.now();
      const btn = document.getElementById("timerBtn");
      if (btn) { btn.disabled = false; btn.textContent = "⏱️ 任务结束"; }
    }
    function getElapsedSec() {
      if (!timerStartedAt) return 0;
      return Math.floor(((timerStoppedAt || Date.now()) - timerStartedAt) / 1000);
    }
    function checkDailyClear(dayNum, course) {
      if (!course || course.type || historyReadonly) return;
      if (progress.clearedDays.includes(dayNum)) return;
      const entries = activeQuestionEntries(course);
      const allOk = entries.every(({ index }) => getQState(qid(dayNum, index)).status === "correct");
      if (!allOk || !entries.length) return;
      progress.clearedDays.push(dayNum);
      const tk = topicKey(dayNum);
      if (!progress.clearedTopics.includes(tk)) progress.clearedTopics.push(tk);
      let gotBonus = false;
      const elapsed = getElapsedSec();
      if (elapsed > 0 && elapsed <= BONUS_TIME_SEC) {
        progress.energy = (progress.energy || 0) + BONUS_ENERGY;
        gotBonus = true;
      }
      saveProgress();
      stopMissionTimer();
      document.getElementById("timerAlert").classList.add("show");
      showClearOverlay(gotBonus, elapsed);
    }
    function showClearOverlay(gotBonus, elapsedSec) {
      document.getElementById("clearTitle").textContent = gotBonus ? "🎉 神速通关！" : "🎉 今日通关！";
      const msg = gotBonus
        ? `20分钟内完成！额外获得 ${BONUS_ENERGY} 点能源奖励！`
        : "你已获得【今日数学之星】称号！";
      document.getElementById("clearMsg").textContent = msg;
      const bonusEl = document.getElementById("clearBonus");
      if (gotBonus) {
        bonusEl.hidden = false;
        bonusEl.textContent = `⚡ 能源 +${BONUS_ENERGY}（用时 ${Math.floor(elapsedSec / 60)} 分 ${elapsedSec % 60} 秒）`;
      } else bonusEl.hidden = true;
      document.getElementById("clearOverlay").classList.add("show");
      runConfetti();
      if (gotBonus) {
        playBgmBurst(14000, 0.38);
        enqueueVoice(() => speak(msg, { rate: 0.78 }));
      } else playClearFanfare();
      refreshEnergyUI();
    }

    function updateCommandBar(dayNum, course) {
      const video = document.getElementById("cmdVideoBtn");
      if (course && course.videoUrl) {
        video.href = course.videoUrl;
        video.style.display = "";
      } else {
        video.removeAttribute("href");
        video.style.display = "none";
      }
      const inQuiz = missionPhase === "quiz" && course && !course.type;
      document.getElementById("cmdPrevBtn").disabled = !inQuiz || currentQIndex <= 0;
      document.getElementById("cmdNextBtn").disabled = !inQuiz || currentQIndex >= QUESTIONS_PER_DAY - 1;
      const id = course && !course.type ? qid(dayNum, currentQIndex) : null;
      const locked = id ? getQState(id).status === "correct" : true;
      document.getElementById("cmdCheckBtn").disabled = !inQuiz || locked || historyReadonly;
      document.getElementById("cmdHintBtn").disabled = !inQuiz;
    }

    function goToQuestion(dayNum, course, qIndex) {
      clearAdvanceTimer();
      closeBriefing();
      currentQIndex = Math.max(0, Math.min(QUESTIONS_PER_DAY - 1, qIndex));
      const slotEl = document.getElementById("quizSlot");
      if (!slotEl) return;
      slotEl.innerHTML = renderQuizCard(dayNum, course, currentQIndex);
      bindActiveQuestion(dayNum, course, currentQIndex);
      updateCommandBar(dayNum, course);
    }

    function renderQuizCard(dayNum, course, qIndex) {
      const entry = course.questions[qIndex];
      if (!entry) return "";
      const id = qid(dayNum, qIndex);
      const state = getQState(id);
      const locked = state.status === "correct";
      let dots = "";
      for (let i = 0; i < QUESTIONS_PER_DAY; i++) {
        const cls = getQState(qid(dayNum, i)).status === "correct" ? "done" : i === qIndex ? "current" : "";
        dots += `<span class="quiz-dot ${cls}"></span>`;
      }
      let feedback = "";
      if (locked) feedback = `<p class="feedback ok">✔️ 已攻克</p>`;
      else if (state.status === "wrong") feedback = `<p class="feedback bad">💥 未命中！可点「听讲解」或再试一次。</p>`;
      return `
        <div class="quiz-card" data-qid="${escapeHtml(id)}" data-hit="${qIndex}">
          <div class="quiz-dots">${dots}</div>
          <p class="q-badge">第 ${qIndex + 1} / ${QUESTIONS_PER_DAY} 题</p>
          <p class="q-text">${escapeHtml(entry.q)}</p>
          <input class="answer-input-lg" type="text" inputmode="numeric" placeholder="在这里输入你的答案" id="activeAnswer" ${locked || historyReadonly ? "disabled" : ""} />
          <div class="feedback-slot" id="activeFeedback">${feedback}</div>
        </div>`;
    }

    function bindActiveQuestion(dayNum, course, qIndex) {
      activeDayNum = dayNum;
      activeCourse = course;
      currentQIndex = qIndex;
      const input = document.getElementById("activeAnswer");
      if (input && !input.disabled) input.focus();
      updateCommandBar(dayNum, course);
    }

    function submitActiveAnswer() {
      if (!activeCourse || historyReadonly) return;
      const qIndex = currentQIndex;
      const dayNum = activeDayNum;
      const course = activeCourse;
      const entry = course.questions[qIndex];
      const id = qid(dayNum, qIndex);
      const input = document.getElementById("activeAnswer");
      const slot = document.getElementById("activeFeedback");
      if (!entry || !input || input.disabled) return;
      const user = input.value;
      if (!normalizeAnswer(user)) {
        slot.innerHTML = `<p class="feedback bad">请先输入答案。</p>`;
        return;
      }
      if (answersEqual(user, entry.answer)) {
        markCorrect(id, qIndex);
        input.disabled = true;
        slot.innerHTML = `<p class="feedback ok">✔️ 命中目标！</p>`;
        refreshDayProgressUI(dayNum);
        refreshEnergyUI();
        updateCommandBar(dayNum, course);
        const next = qIndex + 1;
        if (next >= QUESTIONS_PER_DAY) {
          clearAdvanceTimer();
          advanceTimer = setTimeout(() => checkDailyClear(dayNum, course), 1200);
        } else {
          slot.innerHTML = `<p class="feedback ok">✔️ 命中目标！1.5 秒后进入下一题……</p>`;
          clearAdvanceTimer();
          advanceTimer = setTimeout(() => goToQuestion(dayNum, course, next), 1500);
        }
      } else {
        const st = getQState(id);
        st.status = "wrong";
        st.lastReveal = String(entry.answer);
        setQState(id, st);
        addWrong(id);
        slot.innerHTML = `<p class="feedback bad">💥 未命中！正确答案是 ${escapeHtml(entry.answer)}。需要讲解请点「听讲解」。</p>`;
        input.value = "";
        input.focus();
        speakMissEncourage();
      }
    }

    function hintActiveQuestion() {
      if (!activeCourse) return;
      clearAdvanceTimer();
      const entry = activeCourse.questions[currentQIndex];
      if (!entry) return;
      const info = { course: activeCourse, q: entry, dayNum: activeDayNum, index: currentQIndex };
      // Prefer animated briefing; always speak the same visible caption text
      runBriefing(entry, info);
    }

    function renderDayPicker(activeDay) {
      const days = courses.filter((c) => !c.type);
      let html = `<div class="day-picker">`;
      days.forEach((c) => {
        const cleared = progress.clearedDays.includes(c.dayNum);
        const cls = c.dayNum === activeDay ? "current" : cleared ? "cleared" : "";
        html += `<button type="button" class="day-chip ${cls}" data-day="${c.dayNum}">第${padDay(c.dayNum)}天</button>`;
      });
      html += `</div>`;
      return html;
    }

    function renderMission(dayNum, course) {
      const phaseCls = course.phase === "foundation" ? "foundation" : "advancement";
      const phaseText = phaseLabel(course.phase);
      const scoutedKey = dayKey(dayNum);
      const scouted = progress.scoutedDays.includes(scoutedKey);
      const done = dayQuestionDoneCount(dayNum);
      const allDone = done >= QUESTIONS_PER_DAY;
      const label = course.videoLabel || "";
      const metaBits = [course.videoTitle, course.videoDuration ? "约 " + course.videoDuration : ""].filter(Boolean);

      if (historyReadonly) {
        missionPhase = "quiz";
      } else if (allDone && progress.clearedDays.includes(dayNum)) {
        missionPhase = "done";
      } else if (scouted || done > 0) {
        missionPhase = "quiz";
      } else {
        missionPhase = "video";
      }

      if (!historyReadonly) {
        currentQIndex = firstUnfinishedQIndex(dayNum);
        if (currentQIndex >= QUESTIONS_PER_DAY) currentQIndex = QUESTIONS_PER_DAY - 1;
      } else {
        currentQIndex = Math.min(currentQIndex, QUESTIONS_PER_DAY - 1);
      }

      let body = "";
      if (historyReadonly) {
        body = `<div class="readonly-banner">📅 历史回看（只读）· 可听讲解，不可再次提交<br /><button type="button" class="btn btn-orange" id="exitHistoryBtn" style="margin-top:10px;">返回今日任务</button></div>`;
      }
      if (missionPhase === "video") {
        body += `
          <div class="video-hero">
            <p style="margin:0 0 8px;color:#ffd08a;">第①步：先看教学视频（新标签页打开，本页不离开）</p>
            <p class="video-meta">${escapeHtml(metaBits.join(" · "))}</p>
            <a class="btn btn-orange" id="videoBtn" href="${escapeHtml(course.videoUrl)}" target="_blank" rel="noopener noreferrer">🎬 前往B站观看</a>
            <p style="margin:14px 0 0;color:var(--muted);font-size:0.9rem;">看完后关掉B站标签，回到这里点下面按钮开始做题</p>
            <button type="button" class="btn btn-ghost" id="startQuizBtn" style="margin-top:12px;min-width:200px;">我看完了，开始做题</button>
          </div>`;
      } else if (missionPhase === "quiz") {
        body += `<div id="quizSlot">${renderQuizCard(dayNum, course, currentQIndex)}</div>`;
      } else {
        body += `<div class="rest-box">✅ 第${padDay(dayNum)}天已全部攻克！<br />可点「历史任务」回看，或选择下一天。</div>`;
      }

      return {
        html: `
          ${historyReadonly ? "" : renderDayPicker(dayNum)}
          <h1 class="mission-title">${escapeHtml(course.name.redAlert)}</h1>
          <p class="mission-sub">第${padDay(dayNum)}天 · ${escapeHtml(course.topic || course.name.original)}</p>
          <span class="phase-tag ${phaseCls}">${phaseText}</span>
          <span class="source-tag">${escapeHtml(label)}</span>
          <div class="day-progress-wrap">
            <div class="day-progress-label" id="dayProgressLabel"><span>今日战果</span><span>${done}/${QUESTIONS_PER_DAY}</span></div>
            <div class="day-progress-bar"><div class="day-progress-fill" id="dayProgressFill" style="width:${(done / QUESTIONS_PER_DAY) * 100}%"></div></div>
          </div>
          ${body}`,
        dayNum,
        course
      };
    }

    function renderReview() {
      const all = progress.wrongList.filter((id) => getQState(id).status === "wrong");
      if (!all.length) {
        return `<h1 class="mission-title">📋 错题复盘</h1><div class="review-empty">🎉 暂无待修复漏洞！</div>`;
      }
      let html = `<h1 class="mission-title">📋 错题复盘</h1><p class="mission-sub">共 ${all.length} 题</p><div id="reviewList">`;
      all.forEach((id, i) => {
        const info = lookupQuestion(id);
        if (!info) return;
        const locked = getQState(id).status === "correct";
        html += `
          <article class="question" data-qid="${escapeHtml(id)}" data-hit="${Math.min(i, 3)}">
            <p class="q-badge">错题 · 第${info.index + 1}题</p>
            <p class="q-text">${escapeHtml(info.q.q)}</p>
            <div class="answer-row">
              <input class="answer-input" type="text" inputmode="numeric" placeholder="输入答案" ${locked ? "disabled" : ""} />
              <button type="button" class="btn btn-check" ${locked ? "disabled" : ""}>✅ 确认战果</button>
              <button type="button" class="btn btn-ghost btn-hint">📢 听讲解</button>
            </div>
            <div class="feedback-slot"></div>
          </article>`;
      });
      html += `</div>`;
      return html;
    }

    function bindMissionEvents(packed) {
      const { dayNum, course } = packed;
      activeDayNum = dayNum;
      activeCourse = course;

      const markScoutedAndQuiz = () => {
        const key = dayKey(dayNum);
        if (!progress.scoutedDays.includes(key)) {
          progress.scoutedDays.push(key);
          saveProgress();
        }
        missionPhase = "quiz";
        currentQIndex = firstUnfinishedQIndex(dayNum);
        if (currentQIndex >= QUESTIONS_PER_DAY) currentQIndex = 0;
        mount(false);
      };

      const videoBtn = document.getElementById("videoBtn");
      if (videoBtn) {
        // <a target=_blank> keeps this page; also mark scouted lightly without remount
        videoBtn.addEventListener("click", () => {
          const key = dayKey(dayNum);
          if (!progress.scoutedDays.includes(key)) {
            progress.scoutedDays.push(key);
            saveProgress();
          }
        });
      }
      const startQuizBtn = document.getElementById("startQuizBtn");
      if (startQuizBtn) startQuizBtn.addEventListener("click", markScoutedAndQuiz);
      const exitHistoryBtn = document.getElementById("exitHistoryBtn");
      if (exitHistoryBtn) {
        exitHistoryBtn.addEventListener("click", () => {
          historyReadonly = false;
          selectedDayNum = null;
          mount(false);
        });
      }

      if (missionPhase === "quiz") {
        bindActiveQuestion(dayNum, course, currentQIndex);
        if (!historyReadonly && !timerRunning && !timerStoppedAt) {
          // do not auto-start timer; kid clicks 开始行动
        }
      }

      document.querySelectorAll(".day-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          historyReadonly = false;
          selectedDayNum = Number(btn.dataset.day);
          mount(false);
        });
      });

      // review bind
      const root = document.getElementById("missionRoot");
      root.querySelectorAll(".question").forEach((el) => {
        const id = el.dataset.qid;
        const hitIndex = Number(el.dataset.hit || 0);
        const info = lookupQuestion(id);
        if (!info) return;
        const input = el.querySelector(".answer-input");
        const slot = el.querySelector(".feedback-slot");
        const checkBtn = el.querySelector(".btn-check");
        const hintBtn = el.querySelector(".btn-hint");
        if (hintBtn) hintBtn.addEventListener("click", () => runBriefing(info.q, info));
        if (!checkBtn || checkBtn.disabled) return;
        checkBtn.addEventListener("click", async () => {
          const user = input.value;
          if (!normalizeAnswer(user)) {
            slot.innerHTML = `<p class="feedback bad">请先输入答案。</p>`;
            return;
          }
          if (answersEqual(user, info.q.answer)) {
            markCorrect(id, hitIndex);
            input.disabled = true;
            checkBtn.disabled = true;
            slot.innerHTML = `<p class="feedback ok">✔️ 命中目标！</p>`;
            el.remove();
          } else {
            const st = getQState(id);
            st.status = "wrong";
            st.lastReveal = String(info.q.answer);
            setQState(id, st);
            addWrong(id);
            slot.innerHTML = `<p class="feedback bad">💥 未命中！正确答案是 ${escapeHtml(info.q.answer)}。可点听讲解。</p>`;
            input.value = "";
            await speakMissEncourage();
          }
        });
      });

      updateCommandBar(dayNum, course);
    }

    async function playHomeWelcomeThenMount() {
      const root = document.getElementById("missionRoot");
      const banner = document.getElementById("welcomeBanner");
      const dayNum = getActiveDayNum();
      const welcomeKey = String(dayNum);
      updateMuteBtn();
      refreshRankUI();
      refreshEnergyUI();

      if (progress.lastWelcomeDay === welcomeKey) {
        welcomeGateDone = true;
        banner.hidden = true;
        root.classList.remove("waiting-welcome");
        mount(false);
        maybeStartGuide();
        return;
      }

      const line = pickRandom(WELCOME_SPEECH);
      document.getElementById("encourageText").textContent = line;
      banner.hidden = false;
      document.getElementById("welcomeText").textContent = "🎙️ " + line;
      root.classList.add("waiting-welcome");
      mount(false); // prepare content behind dimmed card

      await playWelcomeComm(line);
      if (!progress.enlistedSpoken && progress.correctCount === 0) {
        progress.enlistedSpoken = true;
        saveProgress();
        await enqueueVoice(() => speak(PROMOTE_SPEECH[0], { file: "voice/promote-0.mp3" }));
      }
      progress.lastWelcomeDay = welcomeKey;
      saveProgress();
      welcomeGateDone = true;
      banner.hidden = true;
      root.classList.remove("waiting-welcome");
      maybeStartGuide();
    }

    function mount(runWelcome) {
      if (runWelcome) {
        playHomeWelcomeThenMount();
        return;
      }
      const root = document.getElementById("missionRoot");
      const dayNum = getActiveDayNum();
      if (!document.getElementById("encourageText").textContent) {
        document.getElementById("encourageText").textContent = pickRandom(ENCOURAGE_LINES);
      }
      refreshRankUI();
      refreshEnergyUI();
      updateMuteBtn();

      const course = findCourseByDay(dayNum);
      if (!course) {
        root.innerHTML = `<div class="empty-box">作战档案尚未送达。</div>`;
        return;
      }
      if (course.type === "review") {
        root.dataset.mode = "review";
        root.innerHTML = renderReview();
        bindMissionEvents({ dayNum, course });
        return;
      }
      root.dataset.mode = "mission";
      const packed = renderMission(dayNum, course);
      root.innerHTML = packed.html;
      bindMissionEvents(packed);
    }

    /* ========== Guide ========== */
    const guideSteps = [
      { el: "#timerBtn", text: "先点击这里开始今日任务！" },
      { el: "#cmdVideoBtn", text: "看完视频回来做题！" },
      { el: "#activeAnswer", text: "在这里输入你的答案" },
      { el: "#cmdCheckBtn", text: "点击这里检查对不对！" }
    ];
    let guideStep = 0;
    function clearGuideHighlight() {
      document.querySelectorAll(".guide-highlight").forEach((n) => n.classList.remove("guide-highlight"));
    }
    function maybeStartGuide() {
      if (localStorage.getItem(GUIDE_KEY) === "1") return;
      // Ensure quiz UI exists for later steps — if still on video, still guide timer+video
      guideStep = 0;
      const overlay = document.getElementById("guideOverlay");
      overlay.hidden = false;
      overlay.classList.add("show");
      showGuideStep();
    }
    function showGuideStep() {
      clearGuideHighlight();
      if (guideStep >= guideSteps.length) {
        document.getElementById("guideText").textContent = "🎖️ 准备好了吗？开始战斗！";
        document.getElementById("guideNextBtn").textContent = "开始战斗";
        return;
      }
      const step = guideSteps[guideStep];
      document.getElementById("guideText").textContent = step.text;
      document.getElementById("guideNextBtn").textContent = "下一步";
      const target = document.querySelector(step.el);
      if (target) {
        target.classList.add("guide-highlight");
        try { target.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {}
      }
    }
    document.getElementById("guideNextBtn").addEventListener("click", () => {
      if (guideStep >= guideSteps.length) {
        localStorage.setItem(GUIDE_KEY, "1");
        clearGuideHighlight();
        const overlay = document.getElementById("guideOverlay");
        overlay.classList.remove("show");
        overlay.hidden = true;
        const line = "🎖️ 准备好了吗？开始战斗！";
        document.getElementById("encourageText").textContent = line;
        speak(line, { rate: 0.8 });
        return;
      }
      guideStep += 1;
      // If entering answer step but still on video, auto enter quiz for demo highlight
      if (guideStep === 2 && missionPhase === "video" && activeCourse) {
        const key = dayKey(activeDayNum);
        if (!progress.scoutedDays.includes(key)) {
          progress.scoutedDays.push(key);
          saveProgress();
        }
        missionPhase = "quiz";
        mount(false);
      }
      showGuideStep();
    });

    /* ========== History ========== */
    function openHistory() {
      const list = document.getElementById("historyList");
      list.innerHTML = "";
      courses.filter((c) => !c.type).forEach((c) => {
        const done = dayQuestionDoneCount(c.dayNum);
        const cleared = progress.clearedDays.includes(c.dayNum);
        const status = cleared ? "✅ 已通关" : done > 0 ? `进行中 ${done}/${QUESTIONS_PER_DAY}` : "未开始";
        const li = document.createElement("li");
        li.innerHTML = `<div><strong>第${padDay(c.dayNum)}天</strong> · ${escapeHtml(c.topic || c.name.original)}<br/><span style="color:#ffd08a;font-size:0.9rem;">${status}</span></div>`;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn-ghost";
        btn.textContent = "回看";
        btn.addEventListener("click", () => {
          historyReadonly = true;
          selectedDayNum = c.dayNum;
          currentQIndex = 0;
          document.getElementById("historyOverlay").classList.remove("show");
          mount(false);
        });
        li.appendChild(btn);
        list.appendChild(li);
      });
      document.getElementById("historyOverlay").classList.add("show");
    }

    /* ========== Timer ========== */
    let timerRemain = TIMER_TOTAL_SEC;
    let timerId = null;
    let timerRunning = false;
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }
    function updateTimerUI() {
      document.getElementById("timerDisplay").textContent = formatTime(timerRemain);
    }

    document.getElementById("timerBtn").addEventListener("click", () => {
      if (timerRunning) return;
      timerRunning = true;
      timerRemain = TIMER_TOTAL_SEC;
      timerStartedAt = Date.now();
      timerStoppedAt = null;
      updateTimerUI();
      document.getElementById("timerBtn").disabled = true;
      document.getElementById("timerBtn").textContent = "⏱️ 计时中…";
      document.getElementById("timerAlert").classList.remove("show");
      timerId = setInterval(() => {
        timerRemain -= 1;
        updateTimerUI();
        if (timerRemain <= 0) {
          stopMissionTimer();
          document.getElementById("timerAlert").classList.add("show");
          const line = "时间到！任务结束，撤退休整！";
          document.getElementById("timerAlert").textContent = "⏰ " + line;
          speak(line, { file: "voice/timer.mp3" });
        }
      }, 1000);
    });

    document.getElementById("cmdPrevBtn").addEventListener("click", () => {
      if (!activeCourse) return;
      goToQuestion(activeDayNum, activeCourse, currentQIndex - 1);
    });
    document.getElementById("cmdNextBtn").addEventListener("click", () => {
      if (!activeCourse) return;
      goToQuestion(activeDayNum, activeCourse, currentQIndex + 1);
    });
    document.getElementById("cmdCheckBtn").addEventListener("click", submitActiveAnswer);
    document.getElementById("cmdHintBtn").addEventListener("click", hintActiveQuestion);
    document.getElementById("cmdVideoBtn").addEventListener("click", () => {
      if (!activeCourse) return;
      const key = dayKey(activeDayNum);
      if (!progress.scoutedDays.includes(key)) {
        progress.scoutedDays.push(key);
        saveProgress();
      }
    });

    document.getElementById("historyOpenBtn").addEventListener("click", openHistory);
    document.getElementById("historyCloseBtn").addEventListener("click", () => {
      document.getElementById("historyOverlay").classList.remove("show");
    });
    document.getElementById("historyOverlay").addEventListener("click", (e) => {
      if (e.target.id === "historyOverlay") document.getElementById("historyOverlay").classList.remove("show");
    });

    document.getElementById("muteBtn").addEventListener("click", () => setMuted(!soundMuted));
    document.getElementById("resetProgressBtn").addEventListener("click", () => {
      if (!confirm("确定清空全部进度？将从列兵、第01天重新开始。")) return;
      progress = defaultProgress();
      saveProgress();
      localStorage.removeItem(GUIDE_KEY);
      ["redAlert_progress_v4", "redAlert_progress_v3_guest", "redAlert_progress_v2", "redAlert_progress_v3", "redAlert_session_v3"].forEach((k) => {
        localStorage.removeItem(k);
      });
      selectedDayNum = null;
      historyReadonly = false;
      location.reload();
    });
    document.getElementById("closeOverlayBtn").addEventListener("click", () => {
      document.getElementById("clearOverlay").classList.remove("show");
      stopBgm();
      historyReadonly = false;
      selectedDayNum = null;
      mount(false);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && document.activeElement && document.activeElement.id === "activeAnswer") {
        submitActiveAnswer();
      }
    });

    (function initDebugDay() {
      const sel = document.getElementById("debugDaySelect");
      if (!sel) return;
      courses.filter((c) => !c.type).forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c.dayNum;
        opt.textContent = `第${padDay(c.dayNum)}天`;
        sel.appendChild(opt);
      });
      document.getElementById("debugDayApply").addEventListener("click", () => {
        historyReadonly = false;
        selectedDayNum = Number(sel.value);
        mount(false);
      });
    })();

    // boot
    mount(true);

  </script>
</body>
</html>
